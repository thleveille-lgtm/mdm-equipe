<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MDM Equipe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1C1712;color:#F2EAD8;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{width:100%;max-width:360px;}
h1{font-size:24px;text-align:center;margin-bottom:4px;}
.sub{text-align:center;color:#8C7B65;font-size:12px;margin-bottom:20px;font-family:monospace;}
.card{background:#241E17;border:1px solid #3D3328;border-radius:12px;padding:20px;margin-bottom:14px;}
label{display:block;font-size:11px;color:#8C7B65;margin-bottom:4px;margin-top:12px;font-family:monospace;}
input[type=text],input[type=password]{width:100%;padding:12px;background:#2E2620;border:1px solid #3D3328;border-radius:8px;color:#F2EAD8;font-size:14px;}
input[type=submit]{width:100%;margin-top:14px;padding:14px;background:#C8713A;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;-webkit-appearance:none;}
.err{color:#B85040;font-size:13px;margin-top:8px;}
.urow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #2A2A1E;font-size:12px;}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:44px;text-align:center;margin-bottom:10px;">🏡</div>
  <h1>Maisons du Monde</h1>
  <p class="sub">// espace équipe commerciale</p>
  <div class="card">
    <form method="GET" action="home.html">
      <label>PRÉNOM</label>
      <input type="text" name="u" placeholder="ex: Amandine" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required/>
      <label>MOT DE PASSE</label>
      <input type="password" name="p" placeholder="••••••••" required/>
      <input type="submit" value="Se connecter →"/>
    </form>
  </div>
  <div class="card">
    <p style="font-size:11px;color:#5C4E3A;font-family:monospace;margin-bottom:8px;">// identifiants équipe</p>
    <div class="urow"><span style="color:#8C7B65;">Manager (admin)</span><span style="color:#5C4E3A;font-family:monospace;">mdm2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Claudia</span><span style="color:#5C4E3A;font-family:monospace;">claudia2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Virginie</span><span style="color:#5C4E3A;font-family:monospace;">virginie2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Sohila</span><span style="color:#5C4E3A;font-family:monospace;">sohila2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Amandine</span><span style="color:#5C4E3A;font-family:monospace;">amandine2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Jehanne</span><span style="color:#5C4E3A;font-family:monospace;">jehanne2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Caroline</span><span style="color:#5C4E3A;font-family:monospace;">caroline2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Audrey</span><span style="color:#5C4E3A;font-family:monospace;">audrey2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Laurine</span><span style="color:#5C4E3A;font-family:monospace;">laurine2026</span></div>
    <div class="urow"><span style="color:#8C7B65;">Guillaume</span><span style="color:#5C4E3A;font-family:monospace;">guillm2026</span></div>
  </div>
</div>
<script>
// Override form to do JS login instead
document.querySelector('form').onsubmit = function(e) {
  e.preventDefault();
  var u = this.u.value.trim().toLowerCase();
  var p = this.p.value.trim();
  var users = [
    {name:"manager",pwd:"mdm2026",role:"admin"},
    {name:"claudia",pwd:"claudia2026",role:"user"},
    {name:"virginie",pwd:"virginie2026",role:"user"},
    {name:"sohila",pwd:"sohila2026",role:"user"},
    {name:"amandine",pwd:"amandine2026",role:"user"},
    {name:"jehanne",pwd:"jehanne2026",role:"user"},
    {name:"caroline",pwd:"caroline2026",role:"user"},
    {name:"audrey",pwd:"audrey2026",role:"user"},
    {name:"laurine",pwd:"laurine2026",role:"user"},
    {name:"guillaume",pwd:"guillm2026",role:"user"}
  ];
  var found = users.find(function(x){ return x.name===u && x.pwd===p; });
  if(found) {
    alert('Connexion réussie ! Bienvenue ' + found.name);
  } else {
    alert('Identifiant ou mot de passe incorrect.');
  }
  return false;
};
</script>
</body>
</html>

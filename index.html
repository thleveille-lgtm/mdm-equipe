:root{--bg:#0F0D0A;--bg2:#1A1610;--bg3:#221E17;--bg4:#2A2520;--border:#3A3028;--border2:#4A3E30;--text:#F5ECD8;--muted:#8C7B65;--dim:#5C4E3A;--accent:#C8713A;--green:#6B9E5E;--gold:#C9993A;--red:#B85040;--blue:#4E7EA8;--purple:#8B6DB3;--radius:14px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,.4);}
.light{--bg:#F5F0E8;--bg2:#EDE8DC;--bg3:#E5DED0;--bg4:#DDD5C5;--border:#C8BC9E;--border2:#B0A080;--text:#2A1F10;--muted:#6B5C40;--dim:#9A8A6A;--shadow:0 4px 24px rgba(0,0,0,.12);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;transition:background .3s,color .3s;}
input,button,select,textarea{font-family:'DM Sans',sans-serif;}
::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes confetti{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100px) rotate(720deg);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px var(--accent)40}50%{box-shadow:0 0 25px var(--accent)80}}
@keyframes popIn{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.anim-up{animation:fadeUp .35s ease both;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s;}
.inp{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;display:block;transition:border-color .2s;}
.inp:focus{border-color:var(--accent);}
.tag{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;display:inline-block;}
.pbar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
.pfill{height:100%;border-radius:3px;transition:width .6s ease;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;overflow:hidden;}
#login::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,var(--accent)15,transparent 70%);pointer-events:none;}
.lbox{width:100%;max-width:380px;position:relative;z-index:1;}
.lbox h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;text-align:center;margin-bottom:4px;}
#app{display:none;flex-direction:column;min-height:100vh;}
header{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;backdrop-filter:blur(12px);}
.h-logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:8px 12px;overflow-x:auto;}
nav a{color:var(--muted);padding:7px 12px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:all .2s;}
nav a.on{background:var(--accent);color:#fff;}
nav a:not(.on):hover{background:var(--bg3);color:var(--text);}
main{padding:18px 14px;flex:1;overflow-y:auto;max-width:640px;width:100%;margin:0 auto;}
.hbtn{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:16px;}
.hbtn:hover{background:var(--bg3);color:var(--text);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;}
.modal-overlay.center{align-items:center;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:fadeUp .3s ease;}
.modal.center{border-radius:20px;animation:popIn .3s ease;}
.modal h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg3);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;}
.btn{display:block;padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all .2s;border:none;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--bg3);color:var(--muted);border:1px solid var(--border);}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.kpi-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:6px 0 2px;}
.kpi-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.04em;}
.kpi-obj{font-size:10px;color:var(--dim);margin-bottom:6px;}
.kpi-pct{font-size:11px;font-weight:700;margin-top:5px;}
.bubble{margin-bottom:12px;display:flex;gap:8px;}
.bubble.me{flex-direction:row-reverse;}
.bav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.bt{max-width:78%;border:1px solid var(--border);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:13px;line-height:1.55;}
.bubble.me .bt{border-radius:18px 18px 4px 18px;border:none;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;}
.badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-family:'DM Mono',monospace;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}
.bday-pill{background:linear-gradient(135deg,var(--accent)22,var(--gold)11);border:1px solid var(--accent)44;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:6px;}
.confetti-piece{position:fixed;pointer-events:none;animation:confetti 2s ease-out both;border-radius:2px;}
.tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px;}
.tab{flex:1;padding:7px;border-radius:8px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;text-decoration:none;color:var(--muted);transition:all .2s;display:block;}
.tab.on{background:var(--bg2);color:var(--text);box-shadow:var(--shadow);}
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;display:inline-block;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}
.col-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:transform .2s;border:3px solid transparent;}
.col-dot.sel{border-color:#fff;transform:scale(1.2);}
.profile-ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 12px;position:relative;}
.profile-ring::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent);animation:spin 4s linear infinite;}
.planning-slot{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:all .2s;}
.planning-slot:hover{border-color:var(--accent);}
/* ACCORDION */
.accordion-btn{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-decoration:none;margin-bottom:4px;}

.accordion-body{background:var(--bg2);border:1px solid var(--border);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:16px;margin-bottom:8px;display:none;}
.accordion-body.open{display:block;}
/* TODO */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}

/* CHARTS */
.chart-svg{width:100%;overflow:visible;}
</style>

function save(){lsS("users",USERS);lsS("ac",AC);lsS("formations",FORMATIONS_DATA);lsS("pub_msgs",PUB_MSGS);lsS("priv_msgs",PRIV_MSGS);lsS("ch",CH);lsS("notes",NOTES);lsS("notifs",NOTIFS);lsS("plannings",PLANNINGS);lsS("obj_custom",OBJ_CUSTOM);lsS("todos",TODOS);}

function fmt(n,isN){if(!n||n===0)return"—";if(isN)return Math.round(n).toString();return n>=1000?(n/1000).toFixed(1)+"K€":Math.round(n)+"€";}
function pct(r,o){return o>0?Math.min(Math.round(r/o*100),999):0;}
function pcHex(p){return p>=100?"#6B9E5E":p>=75?"#C9993A":"#B85040";}
function isAdmin(){return CU&&(CU.role==="admin"||CU.role==="adjoint");}
function getCU(){return USERS.find(function(u){return u.id===CU.id;})||CU;}

function cO(uid,mi){
  var p=PAR[uid];if(!p)return KPIS.reduce(function(a,k){a[k]=0;return a;},{});
  var c=OBJ_CUSTOM[uid]||{};
  return {
    ca:c[mi+"_ca"]||Math.round((OBJ_BASE.ca[mi]||0)*p.ca[mi]/PT.ca),
    can:c[mi+"_can"]||Math.round((OBJ_BASE.can[mi]||0)*p.can[mi]/PT.can),
    out:c[mi+"_out"]||Math.round((OBJ_BASE.out[mi]||0)*p.out[mi]/PT.out),
    b2b:c[mi+"_b2b"]||Math.round((OBJ_BASE.b2b[mi]||0)*p.b2b[mi]/PT.b2b),
    alma:c[mi+"_alma"]||0,tickets:c[mi+"_tickets"]||0,pm:c[mi+"_pm"]||0,iv:c[mi+"_iv"]||0
  };
}
function gC(uid,mi){var k=uid+"_"+mi,s=CH[k]||{},o=cO(uid,mi);return Object.assign({ca:0,can:0,out:0,b2b:0,alma:0,tickets:0,pm:0,iv:0,obj_ca:o.ca,obj_can:o.can,obj_out:o.out,obj_b2b:o.b2b,obj_alma:o.alma,obj_tickets:o.tickets,obj_pm:o.pm,obj_iv:o.iv},s);}
function sC(uid,mi,f,v){var k=uid+"_"+mi;if(!CH[k])CH[k]={};CH[k][f]=parseFloat(v)||0;lsS("ch",CH);}
function saveObj(uid,mi,f,v){if(!OBJ_CUSTOM[uid])OBJ_CUSTOM[uid]={};OBJ_CUSTOM[uid][mi+"_"+f]=parseFloat(v)||0;lsS("obj_custom",OBJ_CUSTOM);}

function todayBdays(){var now=new Date(),m=String(now.getMonth()+1).padStart(2,"0"),d=String(now.getDate()).padStart(2,"0");return USERS.filter(function(u){return u.bday&&u.bday===d+"/"+m;});}
function upcomingBdays(){var now=new Date(),result=[];USERS.forEach(function(u){if(!u.bday)return;var parts=u.bday.split("/");var bd=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[0]));if(bd<=now)bd.setFullYear(now.getFullYear()+1);var diff=Math.ceil((bd-now)/(86400000));if(diff<=60&&diff>0)result.push({user:u,days:diff});});return result.sort(function(a,b){return a.days-b.days;});}
function unreadN(){return NOTIFS.filter(function(n){return !n.read&&(n.to===CU.id||n.to==="admin");}).length;}
function addNotif(to,text,type){NOTIFS.unshift({id:"n"+Date.now(),to:to,from:CU?CU.id:"sys",text:text,type:type||"info",read:false,date:new Date().toLocaleDateString("fr-FR")});lsS("notifs",NOTIFS);updateNBadge();}
function updateNBadge(){var c=unreadN(),b=document.getElementById("notif-badge");if(b){b.style.display=c>0?"block":"none";b.textContent=c;}}
function confetti(){var colors=["#C8713A","#C9993A","#6B9E5E","#4E7EA8","#9B7DB3"];for(var i=0;i<30;i++){var el=document.createElement("div");el.className="confetti-piece";el.style.cssText="left:"+Math.random()*100+"vw;top:-10px;width:"+(4+Math.random()*8)+"px;height:"+(4+Math.random()*8)+"px;background:"+colors[Math.floor(Math.random()*colors.length)]+";animation-delay:"+Math.random()+"s;animation-duration:"+(1.5+Math.random())+"s;";document.body.appendChild(el);setTimeout(function(e){return function(){if(e.parentNode)e.parentNode.removeChild(e);};}(el),3000);}}
function applyTheme(u){if((u||getCU()).theme==="light")document.documentElement.classList.add("light");else document.documentElement.classList.remove("light");var ac=(u||getCU()).accentCol;if(ac)document.documentElement.style.setProperty("--accent",ac);var btn=document.getElementById("theme-btn");if(btn)btn.textContent=(u||getCU()).theme==="light"?"☀️":"🌙";}
function showToast(msg){var t=document.createElement("div");t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:10px 20px;font-size:13px;z-index:9999;animation:popIn .3s ease;white-space:nowrap;";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2500);}

  addNotif("admin","🔑 "+user.name+" demande une réinitialisation de mot de passe.","pwd_reset");

};

function showModal(html,centered){var c=document.getElementById("modal-container");c.innerHTML='<div class="modal-overlay'+(centered?" center":"")+'" id="modal-overlay"><div class="modal'+(centered?" center":"")+'" style="position:relative;">'+html+'</div></div>';document.getElementById("modal-overlay").onclick=function(e){if(e.target===this)closeModal();};bindAll();}
function closeModal(){document.getElementById("modal-container").innerHTML="";}

function showNotifsModal(){
  var items=NOTIFS.filter(function(n){return n.to===CU.id||n.to==="admin";});
  items.forEach(function(n){n.read=true;});lsS("notifs",NOTIFS);updateNBadge();
  var html='<button class="modal-close" data-action="closeModal();">✕</button><h3>🔔 Notifications</h3>';
  if(!items.length)html+='<p style="color:var(--muted);text-align:center;padding:20px;">Aucune notification</p>';
  else html+=items.slice(0,20).map(function(n){return '<div style="padding:12px;background:var(--bg3);border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;"><div style="flex:1;"><p style="font-size:13px;margin-bottom:3px;">'+n.text+'</p><p style="font-size:10px;color:var(--muted);font-family:\'DM Mono\',monospace;">'+n.date+'</p></div>'+(n.type==="pwd_reset"&&isAdmin()?'<a href="#" data-action="closeModal();showResetPwd(\''+n.from+'\');" style="background:var(--accent)22;border-radius:6px;color:var(--accent);font-size:11px;padding:4px 9px;text-decoration:none;flex-shrink:0;">Reset</a>':"")+'</div>';}).join("");
  html+='<br><a href="#" class="btn btn-ghost" data-action="closeModal();">Fermer</a>';
  showModal(html);
}

function showProfile(){
  var u=getCU();
  var colDots=ACCENT_COLS.map(function(c){return '<div class="col-dot'+(u.accentCol===c?" sel":"")+'" style="background:'+c+';" data-action="setAccent(\''+c+'\');"></div>';}).join("");

    +'<div style="display:flex;flex-direction:column;gap:12px;">'

    +'<div><label style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;display:block;margin-bottom:4px;">NOUVEAU MOT DE PASSE</label><input class="inp" id="p-newpwd" type="password" placeholder="Laisser vide pour ne pas changer"/></div>'
    +'<div><label style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;display:block;margin-bottom:6px;">DATE NAISSANCE (JJ/MM)</label><input class="inp" id="p-bday" value="'+(u.bday||"")+'"/></div>'
    +'<div><label style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;display:block;margin-bottom:8px;">COULEUR</label><div style="display:flex;gap:8px;flex-wrap:wrap;" id="col-dots">'+colDots+'</div></div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--bg3);border-radius:10px;"><span style="font-size:13px;">Mode '+(u.theme==="light"?"☀️ Jour":"🌙 Nuit")+'</span><div class="toggle'+(u.theme==="light"?" on":"")+'" data-action="toggleThemeP();"></div></div>'
    +'</div><br><p id="p-err" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none;"></p>'
    +'<a href="#" class="btn btn-accent" data-action="saveProfile();">Enregistrer</a>'
    +'<br><br><a href="#" class="btn btn-ghost" style="margin-top:6px;" data-action="doLogout();">Se déconnecter</a></div>';

var _tAcc=null;
function setAccent(c){_tAcc=c;document.querySelectorAll(".col-dot").forEach(function(d){d.classList.toggle("sel",d.style.background===c||d.style.backgroundColor===c);});}
function toggleThemeP(){var u=getCU();u.theme=u.theme==="light"?"dark":"light";USERS=USERS.map(function(x){return x.id===u.id?u:x;});CU=u;save();applyTheme(u);showProfile();}
function saveProfile(){
  var u=getCU();
  var name=document.getElementById("p-name").value.trim();
  var oldP=document.getElementById("p-oldpwd").value.trim();
  var newP=document.getElementById("p-newpwd").value.trim();
  var bday=document.getElementById("p-bday").value.trim();
  var err=document.getElementById("p-err");
  if(newP&&oldP!==u.pwd){err.textContent="Mot de passe actuel incorrect.";err.style.display="block";return;}
  if(!name){err.textContent="Le prénom ne peut pas être vide.";err.style.display="block";return;}
  u.name=name;u.av=name.substring(0,2).toUpperCase();
  if(newP)u.pwd=newP;if(bday)u.bday=bday;
  if(_tAcc){u.accentCol=_tAcc;u.col=_tAcc;document.documentElement.style.setProperty("--accent",_tAcc);_tAcc=null;}
  USERS=USERS.map(function(x){return x.id===u.id?u:x;});CU=u;save();
  document.getElementById("hav").style.background=u.col;document.getElementById("hav").textContent=u.av;
  closeModal();showToast("Profil mis à jour ✅");
}

// ── NAV ──
function rNav(){
  // Ordre : Accueil, Mes Chiffres, Planning, Formations, Discussion + Admin si manager
  var tabs=[{id:"home",l:"🏠 Accueil"},{id:"chiffres",l:isAdmin()?"📊 Chiffres":"📊 Mes Chiffres"},{id:"planning",l:"📅 Planning"},{id:"formations",l:"🎓 Formations"},{id:"discussion",l:"💬 Discussion"},{id:"todos",l:"✅ Missions"}];
  if(isAdmin())tabs.push({id:"admin",l:"⚙️ Admin"});
  document.getElementById("nav").innerHTML=tabs.map(function(t){return '<a href="#" class="'+(PG===t.id?"on":"")+'" data-pg="'+t.id+'">'+t.l+'</a>';}).join("");
  document.querySelectorAll("nav a").forEach(function(a){a.onclick=function(e){e.preventDefault();PG=this.getAttribute("data-pg");FO=null;MB=null;CHAT_TARGET=null;rNav();rPage();};});
}

function rPage(){
  var m=document.getElementById("main");
  m.style.animation="none";void m.offsetWidth;m.style.animation="fadeUp .3s ease";
  if(PG==="home")m.innerHTML=pH();
  else if(PG==="chiffres")m.innerHTML=isAdmin()&&!MB?pCA():pCU();
  else if(PG==="planning")m.innerHTML=pPlanning();
  else if(PG==="formations")m.innerHTML=FO?pV():pFL();
  else if(PG==="discussion")m.innerHTML=pD();
  else if(PG==="todos")m.innerHTML=pTodos();
  else if(PG==="admin")m.innerHTML=pAdmin();
  bindAll();bindMsg();
  if(PG==="discussion")setTimeout(function(){var e=document.getElementById("me");if(e)e.scrollIntoView({behavior:"smooth"});},100);
}

function bindAll(){document.querySelectorAll("[data-action]").forEach(function(el){el.onclick=function(e){e.preventDefault();try{eval(this.getAttribute("data-action"));}catch(err){console.error(err);}};});}
function bindMsg(){
  var sb=document.getElementById("sbtn");
  if(!sb)return;
  sb.onclick=function(e){
    e.preventDefault();
    var inp=document.getElementById("mi");
    if(!inp||!inp.value.trim())return;
    var t=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    var msg={id:"m"+Date.now(),au:CU.name,av:CU.av,col:CU.col,tx:inp.value.trim(),ti:t,type:"text"};
    if(CHAT_TARGET){
      var key=[CU.id,CHAT_TARGET].sort().join("_");
      if(!PRIV_MSGS[key])PRIV_MSGS[key]=[];
      PRIV_MSGS[key].push(msg);lsS("priv_msgs",PRIV_MSGS);
      if(CU.id!==CHAT_TARGET)addNotif(CHAT_TARGET,"💬 "+CU.name+" vous a envoyé un message.","msg");
    }else{PUB_MSGS.push(msg);lsS("pub_msgs",PUB_MSGS);}
    inp.value="";rPage();
    setTimeout(function(){var e=document.getElementById("me");if(e)e.scrollIntoView({behavior:"smooth"});},100);
  };
  var inp=document.getElementById("mi");
  if(inp)inp.addEventListener("keydown",function(e){if(e.keyCode===13&&!e.shiftKey){e.preventDefault();var sb=document.getElementById("sbtn");if(sb)sb.onclick(e);}});
}

function doLogout(){
  CU=null;PG="home";FO=null;MB=null;CHAT_TARGET=null;
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("lu").value="";document.getElementById("lp").value="";
  document.getElementById("lerr").style.display="none";
  document.getElementById("hadmin").style.display="none";
  document.documentElement.classList.remove("light");
  document.documentElement.style.removeProperty("--accent");
  closeModal();
}

// ── CHARTS ──
function renderLineChart(data,labels,color){
  var w=280,h=80,pad=16;
  var max=Math.max.apply(null,data.concat([1]));
  var pts=data.map(function(v,i){return [pad+i*(w-2*pad)/(data.length-1||1),h-pad-((v/max)*(h-2*pad))];});
  var path=pts.map(function(p,i){return (i===0?"M":"L")+p[0]+","+p[1];}).join(" ");
  var area=path+" L"+pts[pts.length-1][0]+","+(h-pad)+" L"+pts[0][0]+","+(h-pad)+" Z";
  var xl=labels.map(function(l,i){var x=pad+i*(w-2*pad)/(labels.length-1||1);return '<text x="'+x+'" y="'+(h-2)+'" text-anchor="middle" fill="var(--dim)" font-size="7" font-family="DM Mono">'+l+'</text>';}).join("");
  var dots=pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+color+'"/>';}).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;">'
    +'<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.3"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#lg1)"/><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/>'+dots+xl+'</svg>';
}

function renderDonut(val,obj,color,label){
  var p=obj>0?Math.min(val/obj,1):0,pv=Math.round(p*100);
  var r=38,cx=50,cy=50,circ=2*Math.PI*r,dash=p*circ;
  return '<div style="display:flex;flex-direction:column;align-items:center;">'
    +'<svg viewBox="0 0 100 100" style="width:90px;height:90px;">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="10"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-dasharray="'+dash+' '+circ+'" stroke-dashoffset="'+(circ/4)+'" stroke-linecap="round"/>'
    +'<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="bold" font-family="Syne">'+pv+'%</text>'
    +'</svg>'
    +'<p style="font-size:10px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-top:4px;">'+label+'</p>'
    +'<p style="font-size:11px;color:var(--dim);">'+fmt(val)+' / '+fmt(obj)+'</p>'
    +'</div>';
}

  var doneTodos=myTodos.filter(function(t){return t.done;});

  var pendingHtml=pendingTodos.length===0?'<p style="color:var(--dim);font-size:13px;text-align:center;padding:20px;">Aucune mission en cours.</p>'
    :pendingTodos.map(function(t,i){

      return '<div class="todo-item" style="border-color:'+(isOverdue(t.deadline)?"var(--red)44":"var(--border)")+'">'
        +'<div class="todo-cb" data-action="toggleTodo(\''+uid+'\','+realIdx+');">✓</div>'
        +'<div style="flex:1;min-width:0;">'
        +'<p style="font-weight:600;font-size:14px;margin-bottom:4px;">'+t.title+'</p>'
        +(t.desc?'<p style="font-size:12px;color:var(--muted);margin-bottom:4px;">'+t.desc+'</p>':"")
        +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
        +(t.deadline?'<span style="font-size:10px;color:'+(isOverdue(t.deadline)?"var(--red)":"var(--muted)")+';font-family:\'DM Mono\',monospace;">⏰ '+t.deadline+'</span>':"")

        +'</div>'
        +'</div>'
        +(isAdmin()?'<a href="#" data-action="TODOS[\''+uid+'\'].splice('+realIdx+',1);lsS(\'todos\',TODOS);rPage();" style="color:var(--red);font-size:11px;padding:4px 8px;background:var(--red)22;border-radius:6px;text-decoration:none;flex-shrink:0;">✕</a>':"")
        +'</div>';
    }).join("");

  var doneHtml=doneTodos.length===0?"":doneTodos.map(function(t,i){
    var realIdx=myTodos.indexOf(t);
    return '<div class="todo-item" style="opacity:0.6;">'
      +'<div class="todo-cb done" data-action="toggleTodo(\''+uid+'\','+realIdx+');">✓</div>'
      +'<div style="flex:1;"><p style="font-weight:600;font-size:14px;text-decoration:line-through;color:var(--muted);">'+t.title+'</p></div>'
      +(isAdmin()?'<a href="#" data-action="TODOS[\''+uid+'\'].splice('+realIdx+',1);lsS(\'todos\',TODOS);rPage();" style="color:var(--red);font-size:11px;padding:4px 8px;background:var(--red)22;border-radius:6px;text-decoration:none;flex-shrink:0;">✕</a>':"")
      +'</div>';
  }).join("");

  return '<p style="color:var(--muted);font-size:11px;font-family:\'DM Mono\',monospace;margin-bottom:4px;">// MISSIONS</p>'

    +addHtml+teamView
    +'<p style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-bottom:10px;">EN COURS ('+pendingTodos.length+')</p>'

}

function isOverdue(deadline){
  if(!deadline)return false;
  var parts=deadline.split("/");if(parts.length<3)return false;
  var d=new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
  return d<new Date();
}

function toggleTodo(uid,idx){
  if(!TODOS[uid])return;
  TODOS[uid][idx].done=!TODOS[uid][idx].done;
  lsS("todos",TODOS);rPage();
}

function addTodo(){
  var who=document.getElementById("td-who").value;
  var title=document.getElementById("td-title").value.trim();
  var desc=document.getElementById("td-desc").value.trim();
  var deadline=document.getElementById("td-deadline").value.trim();
  if(!title)return;
  if(!TODOS[who])TODOS[who]=[];
  TODOS[who].unshift({id:"t"+Date.now(),title:title,desc:desc,deadline:deadline||null,from:CU.name,done:false,createdAt:new Date().toLocaleDateString("fr-FR")});
  lsS("todos",TODOS);
  var target=USERS.find(function(u){return u.id===who;});
  if(target&&target.id!==CU.id)addNotif(target.id,"✅ Nouvelle mission : "+title+(deadline?" — deadline : "+deadline:""),"todo");
  rPage();showToast("Mission assignée ✅");
}

// ── ADMIN ──
function pAdmin(){
  var tabs='<div class="tabs"><a href="#" class="tab'+(AT==="actu"?" on":"")+'" data-action="AT=\'actu\';rPage();">📡 Actu</a><a href="#" class="tab'+(AT==="users"?" on":"")+'" data-action="AT=\'users\';rPage();">👥 Équipe</a><a href="#" class="tab'+(AT==="notifs"?" on":"")+'" data-action="AT=\'notifs\';rPage();">🔔 Notifs</a></div>';
  var content="";
  if(AT==="actu"){
    var tO=TAGS.map(function(t){return'<option value="'+t+'">'+t+'</option>';}).join("");
    var list=AC.map(function(a,i){return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;"><div style="flex:1;min-width:0;"><span class="tag" style="background:var(--accent)22;color:var(--accent);">'+a.tag+'</span> <span style="font-weight:600;font-size:13px;">'+a.title+'</span></div><a href="#" data-action="AC.splice('+i+',1);lsS(\'ac\',AC);rPage();" style="background:var(--red)22;border-radius:6px;color:var(--red);font-size:11px;padding:4px 9px;text-decoration:none;flex-shrink:0;">✕</a></div>';}).join("");
    content='<div class="card" style="padding:16px;margin-bottom:16px;"><p style="font-size:11px;color:var(--accent);font-family:\'DM Mono\',monospace;margin-bottom:12px;">➕ PUBLIER</p><div style="display:flex;flex-direction:column;gap:10px;"><input class="inp" id="af-t" placeholder="Titre *"/><textarea class="inp" id="af-c" placeholder="Contenu *" rows="3" style="resize:none;"></textarea><select class="inp" id="af-tag" style="background:var(--bg3);">'+tO+'</select><label style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;"><input type="checkbox" id="af-hot"/> Urgent</label><a href="#" data-action="doAddActu();" class="btn btn-accent">Publier →</a></div></div>'+list;
  }
  if(AT==="users"){
    var ulist=USERS.map(function(u){return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;"><div class="av" style="width:32px;height:32px;background:'+u.col+';font-size:10px;flex-shrink:0;">'+u.av+'</div><div style="flex:1;"><p style="font-weight:600;font-size:14px;">'+u.name+(u.bday?" 🎂":"")+'</p><div style="display:flex;gap:6px;margin-top:2px;align-items:center;"><span style="font-size:9px;background:'+(u.role==="admin"?"var(--accent)22":u.role==="adjoint"?"var(--blue)22":"var(--border)")+';color:'+(u.role==="admin"?"var(--accent)":u.role==="adjoint"?"var(--blue)":"var(--muted)")+';padding:1px 6px;border-radius:3px;font-family:\'DM Mono\',monospace;">'+(u.role==="admin"?"ADMIN":u.role==="adjoint"?"ADJOINT":"USER")+'</span><span style="font-size:11px;color:var(--dim);font-family:\'DM Mono\',monospace;">mdp: '+u.pwd+'</span></div></div><div style="display:flex;gap:6px;flex-shrink:0;"><a href="#" data-action="showEditUser(\''+u.id+'\');" style="background:var(--blue)22;border-radius:6px;color:var(--blue);font-size:11px;padding:4px 9px;text-decoration:none;">✏️</a>'+(u.id!==CU.id?'<a href="#" data-action="deleteUser(\''+u.id+'\');" style="background:var(--red)22;border-radius:6px;color:var(--red);font-size:11px;padding:4px 9px;text-decoration:none;">✕</a>':"")+'</div></div>';}).join("");
    content='<a href="#" data-action="showAddUser();" class="btn btn-accent" style="margin-bottom:14px;">➕ Ajouter</a><br><br>'+ulist;
  }
  if(AT==="notifs"){
    var nlist=NOTIFS.filter(function(n){return n.to==="admin"||n.to===CU.id;}).slice(0,30);
    content=(nlist.length===0?'<p style="color:var(--dim);text-align:center;padding:40px;">Aucune notification.</p>':nlist.map(function(n){return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;"><div style="flex:1;"><p style="font-size:13px;margin-bottom:3px;">'+n.text+'</p><p style="font-size:10px;color:var(--muted);font-family:\'DM Mono\',monospace;">'+n.date+'</p></div>'+(n.type==="pwd_reset"?'<a href="#" data-action="showResetPwd(\''+n.from+'\');" style="background:var(--accent)22;border-radius:6px;color:var(--accent);font-size:11px;padding:4px 9px;text-decoration:none;flex-shrink:0;">Reset</a>':"")+'</div>';}).join(""))
      +'<br><a href="#" data-action="NOTIFS=[];lsS(\'notifs\',NOTIFS);rPage();" class="btn btn-ghost">Effacer tout</a>';
  }
  return '<p style="color:var(--muted);font-size:11px;font-family:\'DM Mono\',monospace;margin-bottom:4px;">// ADMINISTRATION</p><h2 style="font-family:\'Syne\',sans-serif;font-size:24px;font-weight:800;margin-bottom:16px;">Gestion</h2>'+tabs+content;
}

function doAddActu(){
  var t=document.getElementById("af-t"),c=document.getElementById("af-c"),tag=document.getElementById("af-tag"),hot=document.getElementById("af-hot");
  if(!t||!t.value.trim()||!c||!c.value.trim())return;
  var d=new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
  var actu={id:"a"+Date.now(),date:d,tag:tag.value,title:t.value.trim(),txt:c.value.trim(),au:CU.name,hot:hot.checked};
  AC.unshift(actu);lsS("ac",AC);
  USERS.forEach(function(u){if(u.id!==CU.id)addNotif(u.id,"📢 "+actu.title,"actu");});
  rPage();showToast("Publié ✅");
}

var _nUCol=ACCENT_COLS[0];
function showAddUser(){
  var cd=ACCENT_COLS.map(function(c){return '<div class="col-dot" style="background:'+c+';" data-action="setAccentNew(\''+c+'\');"></div>';}).join("");
  showModal('<button class="modal-close" data-action="closeModal();">✕</button><h3>➕ Nouveau collaborateur</h3><div style="display:flex;flex-direction:column;gap:10px;"><input class="inp" id="nu-name" placeholder="Prénom *"/><input class="inp" id="nu-pwd" placeholder="Mot de passe *"/><select class="inp" id="nu-role" style="background:var(--bg3);"><option value="user">Vendeur</option><option value="adjoint">Manager Adjoint</option><option value="admin">Manager</option></select><input class="inp" id="nu-bday" placeholder="Date naissance JJ/MM (optionnel)"/><div style="display:flex;gap:8px;flex-wrap:wrap;" id="new-col-dots">'+cd+'</div></div><br><a href="#" data-action="saveNewUser();" class="btn btn-accent">Créer</a><br><br><a href="#" data-action="closeModal();" class="btn btn-ghost" style="margin-top:8px;">Annuler</a>');
}
function setAccentNew(c){_nUCol=c;document.querySelectorAll("#new-col-dots .col-dot").forEach(function(d){d.classList.toggle("sel",d.style.background===c||d.style.backgroundColor===c);});}
function saveNewUser(){var name=document.getElementById("nu-name").value.trim();var pwd=document.getElementById("nu-pwd").value.trim();var role=document.getElementById("nu-role").value;var bday=document.getElementById("nu-bday").value.trim();if(!name||!pwd)return;USERS.push({id:name.toLowerCase().replace(/\s/g,"_")+"_"+Date.now(),name:name,av:name.substring(0,2).toUpperCase(),pwd:pwd,role:role,col:_nUCol,bday:bday||null,theme:"dark",accentCol:_nUCol});save();closeModal();rPage();showToast(name+" ajouté ✅");}

function showEditUser(uid){
  var u=USERS.find(function(x){return x.id===uid;});if(!u)return;
  var cd=ACCENT_COLS.map(function(c){return '<div class="col-dot'+(u.col===c?" sel":"")+'" style="background:'+c+';" data-action="setAccentEdit(\''+uid+'\',\''+c+'\');"></div>';}).join("");
  showModal('<button class="modal-close" data-action="closeModal();">✕</button><h3>✏️ Modifier '+u.name+'</h3><div style="display:flex;flex-direction:column;gap:10px;"><input class="inp" id="eu-name" value="'+u.name+'"/><input class="inp" id="eu-pwd" value="'+u.pwd+'"/><select class="inp" id="eu-role" style="background:var(--bg3);"><option value="user"'+(u.role==="user"?" selected":"")+'>Vendeur</option><option value="adjoint"'+(u.role==="adjoint"?" selected":"")+'>Manager Adjoint</option><option value="admin"'+(u.role==="admin"?" selected":"")+'>Manager</option></select><input class="inp" id="eu-bday" value="'+(u.bday||"")+'" placeholder="JJ/MM"/><div style="display:flex;gap:8px;flex-wrap:wrap;" id="edit-col-dots">'+cd+'</div></div><br><a href="#" data-action="saveEditUser(\''+uid+'\');" class="btn btn-accent">Enregistrer</a><br><br><a href="#" data-action="closeModal();" class="btn btn-ghost" style="margin-top:8px;">Annuler</a>');
}
function setAccentEdit(uid,c){USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{col:c,accentCol:c}):u;});document.querySelectorAll("#edit-col-dots .col-dot").forEach(function(d){d.classList.toggle("sel",d.style.background===c||d.style.backgroundColor===c);});}
function saveEditUser(uid){var name=document.getElementById("eu-name").value.trim();var pwd=document.getElementById("eu-pwd").value.trim();var role=document.getElementById("eu-role").value;var bday=document.getElementById("eu-bday").value.trim();USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{name:name,av:name.substring(0,2).toUpperCase(),pwd:pwd||u.pwd,role:role,bday:bday||null}):u;});save();closeModal();rPage();showToast("Mis à jour ✅");}
function deleteUser(uid){if(!confirm("Supprimer ?"))return;USERS=USERS.filter(function(u){return u.id!==uid;});save();rPage();showToast("Supprimé");}

function showResetPwd(uid){
  var u=USERS.find(function(x){return x.id===uid;});if(!u)return;
  showModal('<button class="modal-close" data-action="closeModal();">✕</button><h3>🔑 Reset mot de passe</h3><p style="color:var(--muted);font-size:13px;margin-bottom:16px;">Nouveau mot de passe pour <strong>'+u.name+'</strong></p><input class="inp" id="rp-pwd" placeholder="Nouveau mot de passe *" style="margin-bottom:12px;"/><a href="#" data-action="doResetPwd(\''+uid+'\');" class="btn btn-accent">Confirmer</a><br><br><a href="#" data-action="closeModal();" class="btn btn-ghost" style="margin-top:8px;">Annuler</a>',true);
}
function doResetPwd(uid){var pwd=document.getElementById("rp-pwd").value.trim();if(!pwd)return;USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{pwd:pwd}):u;});save();closeModal();showToast("Mot de passe réinitialisé ✅");}
</script>

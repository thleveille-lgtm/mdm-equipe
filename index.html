function rBar(vals,objs,labels,color){
  var w=300,h=105,pad=18,n=labels.length||1;
  var max=Math.max.apply(null,vals.concat(objs).concat([1]));
  var bw=Math.max(4,Math.floor((w-2*pad)/n-3));
  var s='<div class="cw"><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;">';
  labels.forEach(function(l,i){
    var x=pad+i*(w-2*pad)/n;
    var ho=objs[i]?Math.round(objs[i]/max*(h-2*pad)):0,hr=vals[i]?Math.round(vals[i]/max*(h-2*pad)):0;
    s+='<rect x="'+x+'" y="'+(h-pad-ho)+'" width="'+(bw/2)+'" height="'+ho+'" fill="'+color+'33" rx="2"/>';
    s+='<rect x="'+(x+bw/2+1)+'" y="'+(h-pad-hr)+'" width="'+(bw/2)+'" height="'+hr+'" fill="'+color+'" rx="2"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(h-2)+'" text-anchor="middle" fill="var(--dim)" font-size="7" font-family="DM Mono">'+l+'</text>';
    if(vals[i])s+='<text x="'+(x+bw/2+1)+'" y="'+(h-pad-hr-3)+'" text-anchor="middle" fill="'+color+'" font-size="7" font-weight="bold">'+fn(vals[i])+'</text>';
    if(objs[i])s+='<text x="'+x+'" y="'+(h-pad-ho-3)+'" text-anchor="middle" fill="'+color+'77" font-size="6">'+fn(objs[i])+'</text>';
  });
  s+='</svg><div style="display:flex;gap:10px;font-size:10px;color:var(--dim);font-family:\'DM Mono\',monospace;margin-top:3px;"><span><span style="display:inline-block;width:7px;height:7px;background:'+color+'33;border-radius:2px;margin-right:2px;"></span>Obj.</span><span><span style="display:inline-block;width:7px;height:7px;background:'+color+';border-radius:2px;margin-right:2px;"></span>Réel</span></div></div>';
  return s;
}
function rLine(vals,labels,color){
  if(!vals||vals.length<2)return'<div class="cw" style="text-align:center;padding:12px;"><p style="color:var(--dim);font-size:12px;">Données insuffisantes</p></div>';
  var w=280,h=80,pad=16;
  var max=Math.max.apply(null,vals.concat([1]));
  var pts=vals.map(function(v,i){return[pad+i*(w-2*pad)/(vals.length-1),(h-pad)-((v||0)/max*(h-2*pad))];});
  var path=pts.map(function(p,i){return(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
  var area=path+" L"+pts[pts.length-1][0].toFixed(1)+","+(h-pad)+" L"+pts[0][0].toFixed(1)+","+(h-pad)+" Z";
  var xl=labels.map(function(l,i){var x=pad+i*(w-2*pad)/(labels.length-1);return '<text x="'+x.toFixed(1)+'" y="'+(h-2)+'" text-anchor="middle" fill="var(--dim)" font-size="7" font-family="DM Mono">'+l+'</text>';}).join("");
  var dots=pts.map(function(p,i){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+color+'"/>'+(vals[i]>0?'<text x="'+p[0].toFixed(1)+'" y="'+(p[1]-5).toFixed(1)+'" text-anchor="middle" fill="'+color+'" font-size="7" font-weight="bold">'+fn(vals[i])+'</text>':"");}).join("");
  return '<div class="cw"><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".3"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#lg)"/><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+xl+'</svg></div>';
}
function rDnt(val,obj,color,label){
  var p=obj>0?Math.min(val/obj,1):0,pv=Math.round(p*100);
  var r=32,cx=40,cy=40,circ=2*Math.PI*r,dash=p*circ;
  return '<div style="display:flex;flex-direction:column;align-items:center;padding:5px;"><svg viewBox="0 0 80 80" style="width:68px;height:68px;"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="8"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-dasharray="'+dash.toFixed(1)+' '+circ.toFixed(1)+'" stroke-dashoffset="'+(circ/4).toFixed(1)+'" stroke-linecap="round"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="bold" font-family="Syne">'+pv+'%</text></svg><p style="font-size:9px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-top:2px;">'+label+'</p><p style="font-size:10px;color:var(--dim);">'+fn(val)+'/'+fn(obj)+'</p></div>';
}

function addPL(){
  var t=document.getElementById("pl-t").value.trim(),d=document.getElementById("pl-d").value.trim(),n=document.getElementById("pl-n").value.trim();
  if(!t||!d)return;
  var fi=document.getElementById("pl-f");
  var np={id:"p"+Date.now(),title:t,date:d,note:n,file:null,file_type:null};
  if(fi&&fi.files&&fi.files[0]){
    var file=fi.files[0];
    var fname=Date.now()+"_"+file.name.replace(/\s/g,"_");
    np.file=fname;
    np.file_type=file.type.startsWith("image")?"image":"pdf";
    toast("Upload en cours...");
    fetch(SB_URL+"/storage/v1/object/uploads/"+fname,{
      method:"POST",
      headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":file.type,"x-upsert":"true"},
      body:file
    }).then(function(r){
      if(r.ok){
        sbSavePlanning(np);
        setTimeout(function(){
          sbQ("plannings","GET",null,"?order=created_at.desc&limit=50").then(function(res){
            if(res){PL=res.map(function(x){return{id:x.id,title:x.title,date:x.date,note:x.note,file:x.file||null,file_type:x.file_type||null};});lsS("pl",PL);}
            else{PL.unshift(np);lsS("pl",PL);}
            nAll("📅 Nouveau planning : "+t,"planning");rPg();toast("Planning publié ✅");
          });
        },1500);
      }
      else{toast("Erreur upload fichier");}
    }).catch(function(){toast("Erreur réseau");});
  } else {
    sbSavePlanning(np);
    setTimeout(function(){
      sbQ("plannings","GET",null,"?order=created_at.desc&limit=50").then(function(res){
        if(res){PL=res.map(function(x){return{id:x.id,title:x.title,date:x.date,note:x.note,file:x.file||null,file_type:x.file_type||null};});lsS("pl",PL);}
        else{PL.unshift(np);lsS("pl",PL);}
        nAll("📅 Nouveau planning : "+t,"planning");rPg();toast("Planning publié ✅");
      });
    },1200);
  }
}

function upFile(fi,type){

  var file=el.files[0];
  var fname=Date.now()+"_"+file.name.replace(/\s/g,"_");
  toast("Upload en cours...");
  fetch(SB_URL+"/storage/v1/object/uploads/"+fname,{
    method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":file.type,"x-upsert":"true"},
    body:file
  }).then(function(r){
    if(r.ok){
      if(type==="pdf"){if(!FD[fi].pdfs)FD[fi].pdfs=[];FD[fi].pdfs.push(fname);}

    }else{r.text().then(function(t){toast("Erreur : "+t);});}
  }).catch(function(){toast("Erreur réseau");});
}

  var sBtn='<a href="#" data-action="showST();" style="display:inline-flex;align-items:center;gap:6px;padding:8px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--muted);font-size:12px;text-decoration:none;margin-bottom:12px;">+ Créer ma propre mission</a> ';

  var pend=myT.filter(function(t){return !t.done;}),done=myT.filter(function(t){return t.done;});

      +'<p style="font-weight:600;font-size:13px;margin-bottom:3px;'+(t.done?"text-decoration:line-through;color:var(--muted);":"")+'">'+t.title+'</p>'
      +(t.desc?'<p style="font-size:12px;color:var(--muted);margin-bottom:3px;">'+t.desc+'</p>':"")
      +'<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">'

      +(t.validated?'<span style="font-size:10px;color:var(--green);font-family:\'DM Mono\',monospace;">✅ Validé</span>':"")
      +'</div></div>'
      +'<div style="display:flex;flex-direction:column;gap:3px;flex-shrink:0;">'
      +(isA()&&t.done&&!t.validated?'<a href="#" data-action="valTD(\''+uid+'\','+ri+');" style="font-size:10px;color:var(--green);padding:2px 6px;background:rgba(107,158,94,.15);border-radius:5px;text-decoration:none;white-space:nowrap;">✅ Valider</a>':"")

function addDV(){
  var nom=document.getElementById("dn").value.trim(),prenom=document.getElementById("dp").value.trim(),tel=document.getElementById("dt").value.trim(),cmd=document.getElementById("dc").value.trim(),note=document.getElementById("dno").value.trim(),date=document.getElementById("dd").value.trim();
  if(!nom||!tel)return;
  var targetUid=isA()&&document.getElementById("duid")?document.getElementById("duid").value:CU.id;
  if(!DV[targetUid])DV[targetUid]=[];
  var nd={id:"d"+Date.now(),nom:nom,prenom:prenom||"",tel:tel,numCmd:cmd||null,note:note,rappelDate:date||null,rSent:false,comments:[]};
  DV[targetUid].unshift(nd);sv();sbSaveDevis(targetUid,nd);rPg();toast("Devis créé ✅");
}
function addDVCom(uid,did){
  var el=document.getElementById("dvc_"+did);
  if(!el||!el.value.trim())return;
  var d=(DV[uid]||[]).find(function(x){return x.id===did;});
  if(!d)return;
  if(!d.comments)d.comments=[];
  d.comments.push({txt:el.value.trim(),au:CU.name,date:new Date().toLocaleDateString("fr-FR")});
  sv();sbSaveDevis(uid,d);rPg();toast("Commentaire ajouté ✅");
}
function delDVCom(uid,did,ci){
  var d=(DV[uid]||[]).find(function(x){return x.id===did;});
  if(!d)return;
  d.comments.splice(ci,1);sv();sbSaveDevis(uid,d);rPg();
}
function showEditDV(uid,did){
  var d=(DV[uid]||[]).find(function(x){return x.id===did;});
  if(!d)return;

function svEditDV(uid,did){

}

    if(res[8]&&res[8].length){DV={};res[8].forEach(function(r){if(!DV[r.uid])DV[r.uid]=[];if(!DV[r.uid].find(function(d){return d.id===r.id;}))DV[r.uid].push({id:r.id,nom:r.nom,prenom:r.prenom,tel:r.tel,numCmd:r.num_cmd,note:r.note,rappelDate:r.rappel_date,rSent:r.r_sent,comments:r.comments||[]});});}
    if(res[9]&&res[9].length){NF=res[9].map(function(r){return{id:r.id,to:r.dest,from:r.sender,text:r.txt,type:r.type,read:r.read,date:r.date};});}
    if(res[11]&&res[11].length){res[11].forEach(function(r){USERS=USERS.map(function(u){return u.id===r.id?Object.assign({},u,{pwd:r.pwd,name:r.name,av:r.av,role:r.role,col:r.col,bday:r.bday,theme:r.theme,ac:r.ac}):u;});});lsS("u",USERS);}
if(res[10]&&res[10].length){PV={};res[10].forEach(function(r){if(!PV[r.conv_key])PV[r.conv_key]=[];if(!PV[r.conv_key].find(function(m){return m.id===r.id;}))PV[r.conv_key].push({id:r.id,au:r.au,av:r.av,col:r.col,ti:r.ti,tx:r.tx});});}
    sv();
  });
}

function startRealtime(){
  setInterval(function(){
    if(!CU)return;
    sbQ("messages","GET",null,"?order=created_at.asc&limit=200").then(function(r){
      if(!r)return;
      var ids=PM.map(function(m){return m.id;}).join(",");
      var rids=r.map(function(m){return m.id;}).join(",");
      if(ids!==rids){PM=r.map(function(x){return{id:x.id,au:x.au,av:x.av,col:x.col,ti:x.ti,tx:x.tx};});lsS("pm",PM);if(PG==="discussion"&&DS==="pub")rPg();}
    });
    if(CT){
      var key=[CU.id,CT].sort().join("_");
      sbQ("messages_prives","GET",null,"?conv_key=eq."+key+"&order=created_at.asc&limit=200").then(function(r){
        if(!r)return;
        var cur=PV[key]||[];
        if(r.length!==cur.length){PV[key]=r.map(function(x){return{id:x.id,au:x.au,av:x.av,col:x.col,ti:x.ti,tx:x.tx};});lsS("pv",PV);if(PG==="discussion"&&DS==="priv")rPg();}
      });
    }
    sbQ("notifications","GET",null,"?dest=eq."+CU.id+"&limit=100").then(function(r){
      if(!r)return;
      var newN=r.filter(function(n){return!NF.find(function(x){return x.id===n.id;});});
      if(newN.length){newN.forEach(function(n){NF.unshift({id:n.id,to:n.dest,from:n.sender,text:n.txt,type:n.type,read:n.read,date:n.date});});lsS("nf",NF);updBadge();}
    });
 sbQ("plannings","GET",null,"?order=created_at.desc&limit=50").then(function(r){
  if(r!==null&&r!==undefined){
    var newPL=r.map(function(x){return{id:x.id,title:x.title,date:x.date,note:x.note,file:x.file||null,file_type:x.file_type||null};});
    var curIds=PL.map(function(p){return p.id;}).join(",");
    var newIds=newPL.map(function(p){return p.id;}).join(",");
    if(curIds!==newIds){PL=newPL;lsS("pl",PL);if(PG==="planning")rPg();}
  }
}); },8000);
}

function sbSaveMsg(msg,type,key){
  if(type==="public")sbQ("messages","POST",{id:msg.id,au:msg.au,av:msg.av,col:msg.col,ti:msg.ti,tx:msg.tx});
  else sbQ("messages_prives","POST",{id:msg.id,conv_key:key,au:msg.au,av:msg.av,col:msg.col,ti:msg.ti,tx:msg.tx});
}

function sbSaveObj(uid,mi,field,val){sbQ("objectifs","POST",{id:uid+"_"+mi+"_"+field,uid:uid,mois:mi,kpi:field,valeur:val});}
function sbSaveUser(u){sbQ("users","POST",{id:u.id,name:u.name,av:u.av,pwd:u.pwd,role:u.role,col:u.col,bday:u.bday,theme:u.theme,ac:u.ac});}function sbSaveFormation(f){sbQ("formations","POST",{id:f.id,title:f.title,emoji:f.emoji,description:f.desc,slides:f.slides,pdfs:f.pdfs,photos:f.photos});}
function sbSavePlanning(p){sbQ("plannings","POST",{id:p.id,title:p.title,date:p.date,note:p.note,file_url:p.file||null,file_type:p.file_type||null});}function sbSaveActu(a){sbQ("actualites","POST",{id:a.id,date:a.date,tag:a.tag,title:a.title,txt:a.txt,au:a.au,hot:a.hot});}
function sbSaveLitige(l){sbQ("litiges","POST",{id:l.id,cmd:l.cmd,nom:l.nom,prenom:l.prenom,email:l.email,motif:l.motif,au:l.au,date:l.date,comments:l.comments||[]});}
function adminDelTodo(btn){
  if(!isA())return;
  var uid=btn.getAttribute("data-uid"),tid=btn.getAttribute("data-tid");
  TD[uid]=(TD[uid]||[]).filter(function(t){return t.id!==tid;});
  lsS("td",TD);sbQ("todos","DELETE",null,"?id=eq."+tid);rPg();toast("Mission supprimée ✅");
}
function adminDelAllTodos(btn){
  if(!isA())return;
  var uid=btn.getAttribute("data-uid");
  var uname=(USERS.find(function(u){return u.id===uid;})||{name:uid}).name;
  if(!confirm("Supprimer toutes les missions de "+uname+" ?"))return;
  var ids=(TD[uid]||[]).map(function(t){return t.id;});
  TD[uid]=[];lsS("td",TD);
  ids.forEach(function(id){sbQ("todos","DELETE",null,"?id=eq."+id);});
  rPg();toast("Missions de "+uname+" supprimées ✅");
}
function adminDelAllTodosEveryone(){
  if(!isA())return;
  if(!confirm("⚠️ Supprimer TOUTES les missions de TOUS les membres ?"))return;
  var ids=[];
  Object.keys(TD).forEach(function(uid){(TD[uid]||[]).forEach(function(t){ids.push(t.id);});TD[uid]=[];});
  lsS("td",TD);
  ids.forEach(function(id){sbQ("todos","DELETE",null,"?id=eq."+id);});
  rPg();toast("Toutes les missions supprimées ✅");
}
function sbSaveTodo(uid,t){sbQ("todos","POST",{id:t.id,uid:uid,title:t.title,detail:t.desc,deadline:t.deadline,assigned_from:t.from,done:t.done,validated:t.validated,self:t.self||false,comments:t.comments||[]});}
function sbSaveDevis(uid,d){if(!d)return;sbQ("devis","POST",{id:d.id,uid:uid,nom:d.nom,prenom:d.prenom,tel:d.tel,num_cmd:d.numCmd,note:d.note,rappel_date:d.rappelDate,r_sent:d.rSent,comments:d.comments||[]});}
function sbSaveNotif(n){sbQ("notifications","POST",{id:n.id,dest:n.to,sender:n.from,txt:n.text,type:n.type,read:n.read,date:n.date});}

  S.users.forEach(u=>{

      <div style="display:flex;align-items:center;gap:8px;">

      <span style="font-size:11px;color:#5C4E3A;font-family:'DM Mono',monospace;">${esc(u.password)}</span>

  });
  $("l-list").innerHTML=h;
}

function doLogin(){
  const lu=$("l-user").value.trim().toLowerCase();
  const lp=$("l-pass").value.trim();
  const found=S.users.find(u=>u.name.trim().toLowerCase()===lu&&u.password===lp);
  if(found){
    S.user=found;
    $("login-screen").style.display="none";
    $("app").style.display="flex";
    $("h-av").style.background=found.color;
    $("h-av").textContent=found.avatar;
    $("h-nm").textContent=found.name;
    if(found.role==="admin") $("h-admin").style.display="inline";
    else $("h-admin").style.display="none";
    renderNav();
    go("home");
  } else {
    $("l-err").textContent="Identifiant ou mot de passe incorrect.";
    $("l-err").style.display="block";
  }
}

function doLogout(){
  S.user=null;
  $("app").style.display="none";
  $("login-screen").style.display="flex";
  $("l-user").value="";$("l-pass").value="";
  $("l-err").style.display="none";
}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!S.user)doLogin();});

      background:${S.active===t.id?(t.id==="admin"?C.blue:C.accent):"transparent"};
      color:${S.active===t.id?"#fff":C.muted};">${t.i} ${t.l}</button>`).join("");
}

function go(page){
  S.active=page; S.fOpen=null; S.membre=null;
  renderNav(); renderPage();
}

// ═══════════════════════════════════
// RENDER PAGE
// ═══════════════════════════════════
function renderPage(){
  const m=$("main");
  m.innerHTML="";
  if(S.active==="home")       m.innerHTML=pageHome();
  else if(S.active==="formations") m.innerHTML=S.fOpen?pageViewer():pageFormList();
  else if(S.active==="chiffres")   m.innerHTML=S.user&&S.user.role==="admin"?pageChifAdmin():pageChifUser();
  else if(S.active==="discussion") {m.innerHTML=pageDiscussion();setTimeout(()=>{const e=$("msg-end");if(e)e.scrollIntoView({behavior:"smooth"});},100);}
  else if(S.active==="admin")      m.innerHTML=pageAdmin();
  m.classList.remove("anim"); void m.offsetWidth; m.classList.add("anim");
}

function openForm(id){S.fOpen=FORMATIONS.find(f=>f.id===id);if(!S.fSlide[id])S.fSlide[id]=0;renderPage();}

function pageViewer(){
  const f=S.fOpen,si=S.fSlide[f.id]||0,sl=f.slides[si],tot=f.slides.length;
  return `
    <button onclick="S.fOpen=null;renderPage();" style="background:none;border:none;color:${C.muted};font-size:13px;margin-bottom:16px;cursor:pointer;">← Retour</button>

      <span class="tag" style="background:${C.accent}22;color:${C.accent};">${f.emoji} ${f.cat}</span>
      <span class="tag" style="background:${C.border};color:${C.muted};">${si+1}/${tot}</span>
    </div>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:10px;">${esc(f.title)}</h2>

      <p style="color:${C.accent};font-size:11px;font-family:'DM Mono',monospace;font-weight:600;margin-bottom:8px;">SLIDE ${si+1}</p>
      <h3 style="font-size:17px;font-weight:700;margin-bottom:14px;line-height:1.3;">${esc(sl.t)}</h3>
      <div style="color:${C.muted};font-size:14px;line-height:1.9;white-space:pre-line;">${esc(sl.c)}</div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <button onclick="prevSl()" style="background:${si===0?C.border:C.bg3};color:${si===0?C.dim:C.muted};border:none;border-radius:10px;padding:11px;flex:1;cursor:pointer;font-size:13px;" ${si===0?"disabled":""}>← Préc.</button>
      ${si<tot-1?`<button onclick="nextSl()" style="background:${C.accent};color:#fff;border:none;border-radius:10px;padding:11px;flex:1;cursor:pointer;font-size:13px;font-weight:600;">Suivant →</button>`
               :`<button onclick="S.fOpen=null;renderPage();" style="background:${C.green};color:#fff;border:none;border-radius:10px;padding:11px;flex:1;cursor:pointer;font-size:13px;font-weight:600;">✓ Terminé !</button>`}
    </div>
    ${f.slides.map((s,i)=>`
      <div onclick="S.fSlide['${f.id}']=${i};renderPage();" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;
        background:${i===si?C.accent+"22":"transparent"};border:1px solid ${i===si?C.accent+"44":"transparent"};">
        <span style="width:20px;height:20px;border-radius:50%;background:${i<=si?C.accent:C.border};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${i<=si?"#fff":C.dim};flex-shrink:0;">${i+1}</span>
        <span style="font-size:12px;color:${i===si?C.text:C.muted};">${esc(s.t)}</span>
      </div>`).join("")}`;
}

function nextSl(){const f=S.fOpen;if((S.fSlide[f.id]||0)<f.slides.length-1){S.fSlide[f.id]=(S.fSlide[f.id]||0)+1;renderPage();}}
function prevSl(){const f=S.fOpen;if((S.fSlide[f.id]||0)>0){S.fSlide[f.id]--;renderPage();}}

function pageChifAdmin(){
  const mi=S.mois;
  const vendeurs=S.users.filter(u=>u.role==="user");
  const T=vendeurs.reduce((a,u)=>{const c=getC(u.id,mi);return{obj_ca:a.obj_ca+c.obj_ca,ca:a.ca+c.ca,obj_can:a.obj_can+c.obj_can,can:a.can+c.can,obj_out:a.obj_out+c.obj_out,out:a.out+c.out,obj_b2b:a.obj_b2b+c.obj_b2b,b2b:a.b2b+c.b2b};},{obj_ca:0,ca:0,obj_can:0,can:0,obj_out:0,out:0,obj_b2b:0,b2b:0});
  const mBtns=MOIS.map((ml,i)=>`<button onclick="S.mois=${i};S.membre=null;renderPage();" style="padding:6px 12px;border-radius:8px;font-size:11px;font-weight:${mi===i?700:400};border:1px solid ${mi===i?C.accent:C.border};background:${mi===i?C.accent:C.bg3};color:${mi===i?"#fff":C.muted};white-space:nowrap;flex-shrink:0;cursor:pointer;">${ml}</button>`).join("");

    const p=pct(s.v,s.o);
    return `<div style="background:${C.bg3};border-radius:10px;padding:12px;">
      <p style="font-size:10px;color:${C.muted};font-family:'DM Mono',monospace;margin-bottom:5px;">${s.l}</p>
      <p style="font-size:16px;font-weight:700;color:${s.c};">${fmt(s.v)}</p>
      <p style="font-size:10px;color:${C.dim};">obj. ${fmt(s.o)} · <span style="color:${pctC(p)};">${p}%</span></p>

  const membres=[...vendeurs].sort((a,b)=>(getC(b.id,mi).ca||0)-(getC(a.id,mi).ca||0)).map((mb,idx)=>{
    const m=getC(mb.id,mi),p=pct(m.ca,m.obj_ca),open=S.membre===mb.id;

      <tr onclick="S.mois=${i};renderPage();" style="background:${i===mi?C.accent+"22":"transparent"};cursor:pointer;">
        <td style="padding:4px 6px;color:${i===mi?C.accent:C.muted};">${ml}</td>

        <td style="padding:4px 6px;text-align:right;color:${pctC(pp)};font-weight:700;">${mc.ca?`${pp}%`:"—"}</td>
      </tr>`;}).join("");
    const panel=open?`
      <div style="border-top:1px solid ${C.border};padding:16px;">
        <p style="font-size:12px;font-weight:700;color:${C.accent};margin-bottom:10px;">✏️ Réalisé — ${MOISF[mi]}</p>

              onblur="setC('${mb.id}',${mi},'${f}',this.value);renderPage();"/></div>`).join("")}
        </div>
        <p style="font-size:12px;font-weight:700;color:${C.blue};margin-bottom:10px;">🎯 Objectifs — ${MOISF[mi]}</p>
        <div class="grid2" style="margin-bottom:14px;">
          ${[{f:"obj_ca",l:"Obj. CA"},{f:"obj_can",l:"Obj. Canapé"},{f:"obj_out",l:"Obj. Outdoor"},{f:"obj_b2b",l:"Obj. BtoB"}].map(({f,l})=>`
            <div><p style="font-size:10px;color:${C.blue};margin-bottom:4px;font-family:'DM Mono',monospace;">${l}</p>
            <input class="inp" type="number" placeholder="0" value="${esc(String(m[f]||""))}" style="font-size:12px;padding:7px 10px;border-color:${C.blue}44;"
              onblur="setC('${mb.id}',${mi},'${f}',this.value);renderPage();"/></div>`).join("")}
        </div>
        <p style="font-size:11px;color:${C.dim};font-family:'DM Mono',monospace;margin-bottom:8px;">VUE ANNUELLE — ${esc(mb.name)}</p>
        <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:11px;font-family:'DM Mono',monospace;">
          <thead><tr style="color:${C.dim};"><td style="padding:4px 6px;">Mois</td><td style="padding:4px 6px;text-align:right;">Obj</td><td style="padding:4px 6px;text-align:right;">Réel</td><td style="padding:4px 6px;text-align:right;">%</td></tr></thead>

        <div onclick="S.membre=S.membre==='${mb.id}'?null:'${mb.id}';renderPage();" style="padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;">

          <div style="flex:1;">
            <p style="font-weight:600;font-size:14px;">${esc(mb.name)}</p>
            <div style="margin-top:4px;"><div class="pbar"><div style="height:100%;border-radius:3px;background:${pctC(p)};width:${Math.min(p,100)}%;transition:width .6s;"></div></div></div>

            <p style="font-weight:700;font-size:16px;color:${pctC(p)};">${p}%</p>
            <p style="font-size:11px;color:${C.dim};">${fmt(m.ca)} / ${fmt(m.obj_ca)}</p>

    <p style="color:${C.muted};font-size:11px;font-family:'DM Mono',monospace;margin-bottom:4px;">// TABLEAU DE BORD ÉQUIPE</p>
    <h2 style="font-size:22px;font-weight:700;margin-bottom:14px;">Chiffres équipe</h2>

      <div class="grid2">${tot}</div>

    ${membres}`;
}

    </div>`;}). join("");
  return `
    <p style="color:${C.muted};font-size:11px;font-family:'DM Mono',monospace;margin-bottom:4px;">// DISCUSSION</p>
    <h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">Équipe MDM <span style="font-size:12px;color:${C.dim};font-weight:400;">· local</span></h2>
    <div style="margin-bottom:14px;">${bubbles}<div id="msg-end"></div></div>
    <div style="display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;background:#1C1712;padding:10px 0;">
      <textarea id="msg-in" class="inp" rows="2" placeholder="Écrire à l'équipe..." style="resize:none;border-radius:12px;"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>

```
  <button onclick="sendMsg()" class="btn" style="background:${esc(u.color)};padding:12px 16px;font-size:18px;flex-shrink:0;border-radius:12px;">↑</button>
</div>`;
```

}

function sendMsg(){
const inp=$(“msg-in”);
if(!inp||!inp.value.trim())return;
const time=new Date().toLocaleTimeString(“fr-FR”,{hour:“2-digit”,minute:“2-digit”});
S.msgs.push({id:“m”+Date.now(),author:S.user.name,avatar:S.user.avatar,color:S.user.color,text:inp.value.trim(),time});
save(); renderPage();
}

if(S.atab===“users”){

content=` <div style="background:${C.bg2};border:1px solid ${C.accent}33;border-radius:16px;padding:20px;margin-bottom:18px;"> <p style="font-weight:700;font-size:14px;color:${C.accent};margin-bottom:10px;">${S.editU?"✏️ Modifier":"➕ Créer un accès"}</p> <div style="display:flex;flex-direction:column;gap:10px;"> <div class="grid2"> <input class="inp" placeholder="Prénom *" value="${esc(uf.name)}" oninput="S.uForm.name=this.value"/> <input class="inp" placeholder="Initiales (AM)" value="${esc(uf.avatar)}" oninput="S.uForm.avatar=this.value.slice(0,2).toUpperCase()"/> </div> <input class="inp" placeholder="Mot de passe *" value="${esc(uf.password)}" oninput="S.uForm.password=this.value"/> <select class="inp" onchange="S.uForm.role=this.value"> <option value="user" ${uf.role==="user"?"selected":""}>Vendeur</option> <option value="admin" ${uf.role==="admin"?"selected":""}>Manager / Admin</option> </select> <div style="display:flex;gap:8px;flex-wrap:wrap;">${dots}</div> <div style="display:flex;gap:10px;"> <button class="btn" style="background:${C.accent};flex:1;" onclick="doSaveUser()">${S.editU?"Enregistrer":"Créer"}</button> ${S.editU?`<button class="btn" style="background:#3D3328;" onclick="S.editU=null;S.uForm={name:'',avatar:'',password:'',role:'user',color:'${C.accent}'};renderPage();">Annuler</button>`:""} </div> </div> </div> ${S.users.map(u=>`

<span style=“font-size:9px;background:${u.role===“admin”?C.accent+“22”:C.border};color:${u.role===“admin”?C.accent:C.dim};padding:1px 6px;border-radius:3px;”>${u.role===“admin”?“ADMIN”:“USER”}</span>
<span style="font-size:11px;color:${C.dim};font-family:'DM Mono',monospace;">mdp: ${esc(u.password)}</span>
</div>
</div>
</div>
<div style="display:flex;gap:6px;flex-shrink:0;">
<button style="background:${C.blue}22;border:none;border-radius:6px;color:${C.blue};font-size:11px;padding:4px 9px;cursor:pointer;" onclick="S.editU='${u.id}';S.uForm={...${JSON.stringify(u)}};renderPage();">✏️</button>
${u.id!==S.user.id?`<button style="background:${C.red}22;border:none;border-radius:6px;color:${C.red};font-size:11px;padding:4px 9px;cursor:pointer;" onclick="S.users=S.users.filter(x=>x.id!=='${u.id}');save();renderPage();">✕</button>`:””}

return ` <p style="color:${C.muted};font-size:11px;font-family:'DM Mono',monospace;margin-bottom:4px;">// ADMINISTRATION</p> <h2 style="font-size:22px;font-weight:700;margin-bottom:18px;">Gestion</h2> ${tabs}${content}`;
}

function doAddActu(){
const af=S.aForm;
if(!af.title||!af.content)return;
const date=new Date().toLocaleDateString(“fr-FR”,{day:“2-digit”,month:“short”,year:“numeric”});
S.actu.unshift({id:“a”+Date.now(),date,…af,author:S.user.name});
S.aForm={title:””,content:””,tag:“📋 RAPPEL”,hot:false};
save(); renderPage();
}

function doSaveUser(){
const uf=S.uForm;
if(!uf.name||!uf.password)return;
if(S.editU){ S.users=S.users.map(u=>u.id===S.editU?{…u,…uf,id:S.editU}:u); }
else{ S.users.push({…uf,id:uf.name.toLowerCase().replace(/\s/g,”*”)+”*”+Date.now()}); }
S.editU=null; S.uForm={name:””,avatar:””,password:””,role:“user”,color:C.accent};
save(); renderPage();
}

  for(var i=0;i<USERS.length;i++){
    if(USERS[i].name.toLowerCase()===lu && USERS[i].password===lp){found=USERS[i];break;}
  }
  if(found){
    S.user=found;
    $("login-screen").style.display="none";
    $("app").style.display="flex";
    $("h-av").style.background=found.color;

function doAddActu(){
var af=S.aForm;
if(!af.title||!af.content)return;
var date=new Date().toLocaleDateString(“fr-FR”,{day:“2-digit”,month:“short”,year:“numeric”});
S.actu.unshift({id:“a”+Date.now(),date:date,tag:af.tag,title:af.title,content:af.content,author:S.user.name,hot:af.hot});
S.aForm={title:””,content:””,tag:“📋 RAPPEL”,hot:false};
save();renderPage();
}

window.addEventListener(“DOMContentLoaded”,function(){
renderUserList();

$(“l-user”).addEventListener(“keydown”,function(e){if(e.key===“Enter”)doLogin();});
$(“h-quit”).addEventListener(“click”,doLogout);
});
</script>

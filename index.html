*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;transition:background .3s,color .3s;}
input,button,select,textarea{font-family:'DM Sans',sans-serif;}
::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes confetti{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100px) rotate(720deg);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px var(--accent)40}50%{box-shadow:0 0 25px var(--accent)80}}
@keyframes popIn{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.anim-up{animation:fadeUp .35s ease both;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s;}
.card:hover{border-color:var(--border2);}
.inp{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;display:block;transition:border-color .2s;}
.inp:focus{border-color:var(--accent);}
.tag{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;display:inline-block;}
.pbar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
.pfill{height:100%;border-radius:3px;transition:width .6s ease;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;overflow:hidden;}
#login::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,var(--accent)15,transparent 70%);pointer-events:none;}
.lbox{width:100%;max-width:380px;position:relative;z-index:1;}
.lbox h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;text-align:center;margin-bottom:4px;}
#app{display:none;flex-direction:column;min-height:100vh;}
header{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;backdrop-filter:blur(12px);}
.h-logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:8px 12px;overflow-x:auto;}
nav a{color:var(--muted);padding:7px 12px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:all .2s;}
nav a.on{background:var(--accent);color:#fff;}
nav a:not(.on):hover{background:var(--bg3);color:var(--text);}
main{padding:18px 14px;flex:1;overflow-y:auto;max-width:600px;width:100%;margin:0 auto;}
.hbtn{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:16px;}
.hbtn:hover{background:var(--bg3);color:var(--text);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;}
.modal-overlay.center{align-items:center;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:fadeUp .3s ease;}
.modal.center{border-radius:20px;animation:popIn .3s ease;}
.modal h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg3);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;}
.btn{display:block;padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all .2s;border:none;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{opacity:.9;}
.btn-ghost{background:var(--bg3);color:var(--muted);border:1px solid var(--border);}
.btn-danger{background:var(--red)22;color:var(--red);}
.btn-green{background:var(--green);color:#fff;}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.kpi-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:6px 0 2px;}
.kpi-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.04em;}
.kpi-obj{font-size:10px;color:var(--dim);margin-bottom:6px;}
.kpi-pct{font-size:11px;font-weight:700;margin-top:5px;}
.bubble{margin-bottom:12px;display:flex;gap:8px;}
.bubble.me{flex-direction:row-reverse;}
.bav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.bt{max-width:78%;border:1px solid var(--border);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:13px;line-height:1.55;}
.bubble.me .bt{border-radius:18px 18px 4px 18px;border:none;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;}
.badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-family:'DM Mono',monospace;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}
.bday-card{background:linear-gradient(135deg,var(--accent)22,var(--gold)11);border:1px solid var(--accent)44;border-radius:var(--radius);padding:16px;margin-bottom:12px;animation:glow 3s infinite;}
.confetti-piece{position:fixed;pointer-events:none;animation:confetti 2s ease-out both;border-radius:2px;}
.tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px;}
.tab{flex:1;padding:7px;border-radius:8px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;text-decoration:none;color:var(--muted);transition:all .2s;display:block;}
.tab.on{background:var(--bg2);color:var(--text);box-shadow:var(--shadow);}
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}
.col-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:transform .2s;border:3px solid transparent;}
.col-dot.sel{border-color:#fff;transform:scale(1.2);}
.profile-ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 12px;position:relative;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px;}

.cal-day.has-data::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--green);}

/* CHARTS SVG */
.chart-svg{width:100%;overflow:visible;}
</style>

// ── HELPERS ──
function fmt(n,isNum){if(!n||n===0)return "—";if(isNum)return Math.round(n).toString();return n>=1000?(n/1000).toFixed(1)+"K€":Math.round(n)+"€";}
function pct(r,o){return o>0?Math.min(Math.round(r/o*100),999):0;}
function pcHex(p){return p>=100?"#6B9E5E":p>=75?"#C9993A":"#B85040";}
function isAdmin(){return CU&&(CU.role==="admin"||CU.role==="adjoint");}
function getCU(){return USERS.find(function(u){return u.id===CU.id;})||CU;}

function cO(uid,mi){
  var p=PAR[uid];if(!p)return{ca:0,can:0,out:0,b2b:0,alma:0,tickets:0,pm:0,iv:0};
  var custom=OBJ_CUSTOM[uid]||{};
  return {
    ca:custom[mi+"_ca"]||Math.round((OBJ_BASE.ca[mi]||0)*p.ca[mi]/PT.ca),
    can:custom[mi+"_can"]||Math.round((OBJ_BASE.can[mi]||0)*p.can[mi]/PT.can),
    out:custom[mi+"_out"]||Math.round((OBJ_BASE.out[mi]||0)*p.out[mi]/PT.out),
    b2b:custom[mi+"_b2b"]||Math.round((OBJ_BASE.b2b[mi]||0)*p.b2b[mi]/PT.b2b),
    alma:custom[mi+"_alma"]||0,tickets:custom[mi+"_tickets"]||0,pm:custom[mi+"_pm"]||0,iv:custom[mi+"_iv"]||0
  };
}
function gC(uid,mi){var k=uid+"_"+mi,s=CH[k]||{},o=cO(uid,mi);return Object.assign({obj_ca:o.ca,ca:0,obj_can:o.can,can:0,obj_out:o.out,out:0,obj_b2b:o.b2b,b2b:0,obj_alma:o.alma,alma:0,obj_tickets:o.tickets,tickets:0,obj_pm:o.pm,pm:0,obj_iv:o.iv,iv:0},s);}
function sC(uid,mi,f,v){var k=uid+"_"+mi;if(!CH[k])CH[k]={};CH[k][f]=parseFloat(v)||0;lsS("ch",CH);}
function saveObj(uid,mi,field,val){if(!OBJ_CUSTOM[uid])OBJ_CUSTOM[uid]={};OBJ_CUSTOM[uid][mi+"_"+field]=parseFloat(val)||0;lsS("obj_custom",OBJ_CUSTOM);}

function todayBirthdays(){var now=new Date();var m=String(now.getMonth()+1).padStart(2,"0");var d=String(now.getDate()).padStart(2,"0");return USERS.filter(function(u){return u.bday&&u.bday===d+"/"+m;});}
function upcomingBirthdays(){var now=new Date();var result=[];USERS.forEach(function(u){if(!u.bday)return;var parts=u.bday.split("/");var d=parseInt(parts[0]),m=parseInt(parts[1])-1;var bd=new Date(now.getFullYear(),m,d);if(bd<now)bd.setFullYear(now.getFullYear()+1);var diff=Math.ceil((bd-now)/(1000*60*60*24));if(diff<=30&&diff>0)result.push({user:u,days:diff});});return result.sort(function(a,b){return a.days-b.days;});}
function unreadNotifs(){return NOTIFS.filter(function(n){return !n.read&&(n.to===CU.id||n.to==="admin");}).length;}
function addNotif(to,text,type){NOTIFS.unshift({id:"n"+Date.now(),to:to,from:CU?CU.id:"system",text:text,type:type||"info",read:false,date:new Date().toLocaleDateString("fr-FR")});lsS("notifs",NOTIFS);updateNotifBadge();}
function updateNotifBadge(){var count=unreadNotifs();var badge=document.getElementById("notif-badge");if(badge){badge.style.display=count>0?"block":"none";badge.textContent=count;}}
function confettiEffect(){var colors=["#C8713A","#C9993A","#6B9E5E","#4E7EA8","#9B7DB3"];for(var i=0;i<30;i++){var el=document.createElement("div");el.className="confetti-piece";el.style.cssText="left:"+Math.random()*100+"vw;top:-10px;width:"+(4+Math.random()*8)+"px;height:"+(4+Math.random()*8)+"px;background:"+colors[Math.floor(Math.random()*colors.length)]+";animation-delay:"+Math.random()+"s;animation-duration:"+(1.5+Math.random())+"s;";document.body.appendChild(el);setTimeout(function(e){return function(){if(e.parentNode)e.parentNode.removeChild(e);};}(el),3000);}}
function applyTheme(user){var u=user||getCU();if(u.theme==="light")document.documentElement.classList.add("light");else document.documentElement.classList.remove("light");if(u.accentCol)document.documentElement.style.setProperty("--accent",u.accentCol);var btn=document.getElementById("theme-btn");if(btn)btn.textContent=u.theme==="light"?"☀️":"🌙";}
function showToast(msg){var t=document.createElement("div");t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:10px 20px;font-size:13px;z-index:999;animation:popIn .3s ease;white-space:nowrap;";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2500);}

function showModal(html,centered){var c=document.getElementById("modal-container");c.innerHTML='<div class="modal-overlay'+(centered?" center":"")+'" id="modal-overlay"><div class="modal'+(centered?" center":"")+'" style="position:relative;">'+html+'</div></div>';document.getElementById("modal-overlay").onclick=function(e){if(e.target===this)closeModal();};bindAll();}
function closeModal(){document.getElementById("modal-container").innerHTML="";}

function showNotifsModal(){
  var items=NOTIFS.filter(function(n){return n.to===CU.id||n.to==="admin";});
  items.forEach(function(n){n.read=true;});lsS("notifs",NOTIFS);updateNotifBadge();
  var html='<button class="modal-close" data-action="closeModal();">✕</button><h3>🔔 Notifications</h3>';

  html+='<br><a href="#" class="btn btn-ghost" data-action="closeModal();">Fermer</a>';

var _tempAccent=null;
function setAccent(c){_tempAccent=c;document.querySelectorAll(".col-dot").forEach(function(d){d.classList.toggle("sel",d.style.background===c||d.style.backgroundColor===c);});}
function toggleThemeInProfile(){var u=getCU();u.theme=u.theme==="light"?"dark":"light";USERS=USERS.map(function(x){return x.id===u.id?u:x;});CU=u;save();applyTheme(u);showProfile();}
function saveProfile(){
  var u=getCU();
  var newName=document.getElementById("p-name").value.trim();
  var oldPwd=document.getElementById("p-oldpwd").value.trim();
  var newPwd=document.getElementById("p-newpwd").value.trim();
  var bday=document.getElementById("p-bday").value.trim();
  var err=document.getElementById("p-err");
  if(newPwd&&oldPwd!==u.pwd){err.textContent="Mot de passe actuel incorrect.";err.style.display="block";return;}
  if(!newName){err.textContent="Le prénom ne peut pas être vide.";err.style.display="block";return;}
  u.name=newName;u.av=newName.substring(0,2).toUpperCase();
  if(newPwd)u.pwd=newPwd;if(bday)u.bday=bday;
  if(_tempAccent){u.accentCol=_tempAccent;u.col=_tempAccent;document.documentElement.style.setProperty("--accent",_tempAccent);_tempAccent=null;}
  USERS=USERS.map(function(x){return x.id===u.id?u:x;});CU=u;save();
  document.getElementById("hav").style.background=u.col;document.getElementById("hav").textContent=u.av;
  closeModal();showToast("Profil mis à jour ✅");
}

// ── NAV ──
function rNav(){
  var tabs=[{id:"home",l:"🏠 Accueil"},{id:"formations",l:"🎓 Formations"},{id:"chiffres",l:isAdmin()?"📊 Chiffres":"📊 Mes Chiffres"},{id:"discussion",l:"💬 Discussion"},{id:"planning",l:"📅 Planning"}];
  if(isAdmin())tabs.push({id:"admin",l:"⚙️ Admin"});
  document.getElementById("nav").innerHTML=tabs.map(function(t){return '<a href="#" class="'+(PG===t.id?"on":"")+'" data-pg="'+t.id+'">'+t.l+'</a>';}).join("");
  document.querySelectorAll("nav a").forEach(function(a){a.onclick=function(e){e.preventDefault();PG=this.getAttribute("data-pg");FO=null;MB=null;CHAT_TARGET=null;rNav();rPage();};});
}

function rPage(){
  var m=document.getElementById("main");
  m.style.animation="none";void m.offsetWidth;m.style.animation="fadeUp .3s ease";
  if(PG==="home")m.innerHTML=pH();
  else if(PG==="formations")m.innerHTML=FO?pV():pFL();
  else if(PG==="chiffres")m.innerHTML=isAdmin()&&!MB?pCA():pCU();
  else if(PG==="discussion")m.innerHTML=pD();
  else if(PG==="planning")m.innerHTML=pPlanning();
  else if(PG==="admin")m.innerHTML=pAdmin();
  bindAll();bindMsg();
  if(PG==="discussion")setTimeout(function(){var e=document.getElementById("me");if(e)e.scrollIntoView({behavior:"smooth"});},100);
}

function bindAll(){document.querySelectorAll("[data-action]").forEach(function(el){el.onclick=function(e){e.preventDefault();try{eval(this.getAttribute("data-action"));}catch(err){console.error(err);}};});}

function bindMsg(){
  var sb=document.getElementById("sbtn");
  if(!sb)return;
  sb.onclick=function(e){
    e.preventDefault();
    var inp=document.getElementById("mi");if(!inp||!inp.value.trim())return;
    var t=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    var msg={id:"m"+Date.now(),au:CU.name,av:CU.av,col:CU.col,tx:inp.value.trim(),ti:t};
    if(CHAT_TYPE==="public"){PUB_MSGS.push(msg);lsS("pub_msgs",PUB_MSGS);}
    else if(CHAT_TARGET){
      var key=[CU.id,CHAT_TARGET].sort().join("_");
      if(!PRIV_MSGS[key])PRIV_MSGS[key]=[];
      PRIV_MSGS[key].push(msg);lsS("priv_msgs",PRIV_MSGS);
      if(CU.id!==CHAT_TARGET)addNotif(CHAT_TARGET,"💬 "+CU.name+" vous a envoyé un message.","msg");
    }
    inp.value="";rPage();
    setTimeout(function(){var e=document.getElementById("me");if(e)e.scrollIntoView({behavior:"smooth"});},100);
  };
  var inp=document.getElementById("mi");
  if(inp)inp.addEventListener("keydown",function(e){if(e.keyCode===13&&!e.shiftKey){e.preventDefault();var sb=document.getElementById("sbtn");if(sb)sb.onclick(e);}});
}

function doLogout(){
  CU=null;PG="home";FO=null;MB=null;CHAT_TARGET=null;
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("lu").value="";document.getElementById("lp").value="";
  document.getElementById("lerr").style.display="none";
  document.getElementById("hadmin").style.display="none";
  document.documentElement.classList.remove("light");
  document.documentElement.style.removeProperty("--accent");
  closeModal();
}

function pH(){

  var bdays=todayBirthdays();
  var upcoming=upcomingBirthdays();
  var lastMsg=PUB_MSGS.length>0?PUB_MSGS[PUB_MSGS.length-1]:null;

  var kpi="";
  if(!isAdmin()){
    var s1=pct(m.ca,m.obj_ca),s2=pct(m.out,m.obj_out);
    kpi='<div class="g2" style="margin-bottom:16px;"><div class="kpi-card"><p class="kpi-label">CA '+MOIS[mi]+'</p><p class="kpi-val" style="color:'+pcHex(s1)+'">'+fmt(m.ca)+'</p><p class="kpi-obj">obj. '+fmt(m.obj_ca)+'</p><div class="pbar"><div class="pfill" style="width:'+Math.min(s1,100)+'%;background:'+pcHex(s1)+';"></div></div><p class="kpi-pct" style="color:'+pcHex(s1)+'">'+s1+'%</p></div><div class="kpi-card"><p class="kpi-label">OUTDOOR '+MOIS[mi]+'</p><p class="kpi-val" style="color:'+pcHex(s2)+'">'+fmt(m.out)+'</p><p class="kpi-obj">obj. '+fmt(m.obj_out)+'</p><div class="pbar"><div class="pfill" style="width:'+Math.min(s2,100)+'%;background:'+pcHex(s2)+';"></div></div><p class="kpi-pct" style="color:'+pcHex(s2)+'">'+s2+'%</p></div></div>';
  }else{
    var vendeurs=USERS.filter(function(u){return u.role==="user";});
    var T={ca:0,obj_ca:0,out:0,obj_out:0};

// ── GRAPHIQUES SVG ──
function renderLineChart(data,labels,color,height){
  height=height||120;
  var w=300,h=height,pad=20;
  var max=Math.max.apply(null,data.concat([1]));
  var points=data.map(function(v,i){var x=pad+i*(w-2*pad)/(data.length-1||1);var y=h-pad-((v/max)*(h-2*pad));return [x,y];});
  var path=points.map(function(p,i){return (i===0?"M":"L")+p[0]+","+p[1];}).join(" ");
  var area=path+" L"+points[points.length-1][0]+","+(h-pad)+" L"+points[0][0]+","+(h-pad)+" Z";
  var xLabels=labels.map(function(l,i){var x=pad+i*(w-2*pad)/(labels.length-1||1);return '<text x="'+x+'" y="'+(h-4)+'" text-anchor="middle" fill="var(--dim)" font-size="8" font-family="DM Mono,monospace">'+l+'</text>';}).join("");
  var dots=points.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+color+'" />';}).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg" style="height:'+h+'px;">'
    +'<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.3"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#g1)"/>'
    +'<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    +dots+xLabels
    +'</svg>';
}

function renderDonutChart(val,obj,color){
  var pctVal=obj>0?Math.min(val/obj,1):0;
  var r=40,cx=60,cy=60,circ=2*Math.PI*r;
  var dash=pctVal*circ;
  var p=Math.round(pctVal*100);
  return '<svg viewBox="0 0 120 120" style="width:120px;height:120px;">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="12"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-dasharray="'+dash+' '+circ+'" stroke-dashoffset="'+(circ/4)+'" stroke-linecap="round" style="transition:stroke-dasharray .8s ease;"/>'
    +'<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="bold" font-family="Syne,sans-serif">'+p+'%</text>'
    +'</svg>';
}

function renderBarChart(realData,objData,labels,color){
  var w=300,h=100,pad=20;
  var max=Math.max.apply(null,realData.concat(objData).concat([1]));
  var bw=(w-2*pad)/(labels.length||1)-3;
  var bars=realData.map(function(v,i){
    var x=pad+i*((w-2*pad)/(labels.length||1));
    var ho=objData[i]?Math.round((objData[i]/max)*(h-2*pad)):0;
    var hr=Math.round((v/max)*(h-2*pad));
    return '<rect x="'+x+'" y="'+(h-pad-ho)+'" width="'+(bw/2)+'" height="'+ho+'" fill="'+color+'33" rx="2"/>'
      +'<rect x="'+(x+bw/2+1)+'" y="'+(h-pad-hr)+'" width="'+(bw/2)+'" height="'+hr+'" fill="'+color+'" rx="2"/>'
      +'<text x="'+(x+bw/2)+'" y="'+(h-2)+'" text-anchor="middle" fill="var(--dim)" font-size="7" font-family="DM Mono,monospace">'+labels[i]+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg" style="height:'+h+'px;">'+bars+'</svg>';
}

// ── CALENDRIER ──
function renderCalendar(uid){
  var now=new Date();
  var year=CAL_YEAR,month=CAL_MONTH;
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var days=["L","M","M","J","V","S","D"];
  var adj=(firstDay+6)%7;

  var cells="";
  for(var i=0;i<adj;i++) cells+='<div class="cal-day other-month"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dateStr=year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var key=uid+"_"+dateStr;
    var hasData=DAILY_CH[key]&&Object.keys(DAILY_CH[key]).some(function(k){return DAILY_CH[key][k]>0;});
    var isToday=now.getFullYear()===year&&now.getMonth()===month&&now.getDate()===d;
    var isSel=CAL_SEL_DATE===dateStr;
    cells+='<div class="cal-day'+(isToday?" today":"")+(isSel?" sel":"")+(hasData?" has-data":"")+'" data-action="CAL_SEL_DATE=\''+dateStr+'\';rPage();">'+d+'</div>';
  }

  var selData=CAL_SEL_DATE&&DAILY_CH[uid+"_"+CAL_SEL_DATE]?DAILY_CH[uid+"_"+CAL_SEL_DATE]:{};
  var selHtml=CAL_SEL_DATE?'<div class="card" style="padding:14px;margin-top:12px;">'
    +'<p style="font-size:11px;color:var(--accent);font-family:\'DM Mono\',monospace;margin-bottom:10px;">📅 SAISIE — '+CAL_SEL_DATE+'</p>'
    +'<div class="g2">'
    +KPIS.map(function(k){return '<div><p style="font-size:10px;color:var(--muted);margin-bottom:3px;font-family:\'DM Mono\',monospace;">'+KPI_LABELS[k]+'</p><input type="number" placeholder="0" value="'+(selData[k]||"")+'" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;" onblur="saveDailyC(\''+uid+'\',\''+CAL_SEL_DATE+'\',\''+k+'\',this.value);"/></div>';}).join("")
    +'</div></div>':'<p style="font-size:12px;color:var(--dim);text-align:center;margin-top:10px;">Cliquez sur un jour pour saisir</p>';

  return '<div class="card" style="padding:14px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
    +'<a href="#" data-action="CAL_MONTH=(CAL_MONTH-1+12)%12;if(CAL_MONTH===11)CAL_YEAR--;CAL_SEL_DATE=null;rPage();" style="color:var(--muted);text-decoration:none;font-size:18px;">‹</a>'
    +'<p style="font-family:\'Syne\',sans-serif;font-weight:700;font-size:14px;">'+MOISF[month]+' '+year+'</p>'
    +'<a href="#" data-action="CAL_MONTH=(CAL_MONTH+1)%12;if(CAL_MONTH===0)CAL_YEAR++;CAL_SEL_DATE=null;rPage();" style="color:var(--muted);text-decoration:none;font-size:18px;">›</a>'
    +'</div>'
    +'<div class="cal-grid">'+days.map(function(d){return '<div style="text-align:center;font-size:9px;color:var(--dim);font-family:\'DM Mono\',monospace;padding:4px;">'+d+'</div>';}).join("")+cells+'</div>'
    +selHtml
    +'</div>';
}

function saveDailyC(uid,date,field,val){
  var key=uid+"_"+date;if(!DAILY_CH[key])DAILY_CH[key]={};

// ── CHIFFRES USER ──
function pCU(){
  var uid=MB||CU.id;
  var user=USERS.find(function(u){return u.id===uid;})||getCU();
  var m=gC(uid,MI);
  var backBtn=MB?'<a href="#" data-action="MB=null;rPage();" style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:16px;">← Retour équipe</a>':"";
  var mBtns=MOIS.map(function(ml,i){return '<a href="#" data-action="MI='+i+';rPage();" style="padding:6px 12px;border-radius:8px;font-size:11px;border:1px solid '+(MI===i?"var(--accent)":"var(--border)")+';background:'+(MI===i?"var(--accent)":"var(--bg3)")+';color:'+(MI===i?"#fff":"var(--muted)")+';white-space:nowrap;text-decoration:none;display:inline-block;font-weight:'+(MI===i?"600":"400")+';">'+ml+'</a>';}).join("");

  // Toutes les KPIs
  var kpis=KPIS.map(function(k){var v=m[k]||0,o=m["obj_"+k]||0,p=pct(v,o);var isNum=(k==="tickets"||k==="iv");return '<div class="kpi-card"><p class="kpi-label">'+KPI_LABELS[k]+'</p><p class="kpi-val" style="color:'+KPI_COLORS[k]+'">'+fmt(v,isNum)+'</p><p class="kpi-obj">obj. '+fmt(o,isNum)+'</p><div class="pbar"><div class="pfill" style="width:'+Math.min(p,100)+'%;background:'+KPI_COLORS[k]+';"></div></div><p class="kpi-pct" style="color:'+pcHex(p)+'">'+p+'%</p></div>';}).join("");

  // Cumuls
  var qStart=[0,3,6,9];var curQ=Math.floor(MI/3);var q=qStart[curQ];
  var qCA=0,qOCA=0,annCA=0,annOCA=0;
  for(var i=0;i<=MI;i++){var mc=gC(uid,i);annCA+=mc.ca;annOCA+=mc.obj_ca;if(i>=q&&i<q+3){qCA+=mc.ca;qOCA+=mc.obj_ca;}}

  // Graphique : données selon vue
  var chartData=[],chartLabels=[],chartObj=[];
  if(CHART_VIEW==="monthly"){
    for(var i=0;i<=MI;i++){var mc=gC(uid,i);chartData.push(mc[CHART_KPI]||0);chartObj.push(mc["obj_"+CHART_KPI]||0);chartLabels.push(MOIS[i]);}
  } else if(CHART_VIEW==="quarterly"){
    for(var qi=0;qi<4;qi++){var qs=qStart[qi],qv=0,qo=0;for(var i2=qs;i2<qs+3;i2++){var mc=gC(uid,i2);qv+=mc[CHART_KPI]||0;qo+=mc["obj_"+CHART_KPI]||0;}chartData.push(qv);chartObj.push(qo);chartLabels.push("T"+(qi+1));}
  } else {
    var av=0,ao=0;for(var i=0;i<12;i++){var mc=gC(uid,i);av+=mc[CHART_KPI]||0;ao+=mc["obj_"+CHART_KPI]||0;}chartData=[av];chartObj=[ao];chartLabels=["2026"];
  }

  var chartKpiSel=KPIS.map(function(k){return '<a href="#" data-action="CHART_KPI=\''+k+'\';rPage();" style="padding:4px 8px;border-radius:6px;font-size:10px;border:1px solid '+(CHART_KPI===k?"var(--accent)":"var(--border)")+';background:'+(CHART_KPI===k?"var(--accent)":"var(--bg3)")+';color:'+(CHART_KPI===k?"#fff":"var(--muted)")+';text-decoration:none;display:inline-block;">'+KPI_LABELS[k]+'</a>';}).join("");
  var chartViewSel=['monthly','quarterly','annual'].map(function(v,i){var l=["Mensuel","Trimestriel","Annuel"][i];return '<a href="#" data-action="CHART_VIEW=\''+v+'\';rPage();" style="padding:5px 10px;border-radius:6px;font-size:11px;border:1px solid '+(CHART_VIEW===v?"var(--accent)":"var(--border)")+';background:'+(CHART_VIEW===v?"var(--accent)":"var(--bg3)")+';color:'+(CHART_VIEW===v?"#fff":"var(--muted)")+';text-decoration:none;display:inline-block;">'+l+'</a>';}).join("");

  var donutsHtml='<div class="g2" style="margin-bottom:14px;">'
    +[{k:"ca",l:"CA",c:"#6B9E5E"},{k:"out",l:"Outdoor",c:"#C8713A"}].map(function(s){var v=m[s.k]||0,o=m["obj_"+s.k]||0;return '<div class="kpi-card" style="display:flex;flex-direction:column;align-items:center;padding:12px;">'+renderDonutChart(v,o,s.c)+'<p class="kpi-label" style="margin-top:6px;">'+s.l+'</p><p style="font-size:12px;color:var(--muted);">'+fmt(v)+' / '+fmt(o)+'</p></div>';}).join("")
    +'</div>';

  var editHtml=isAdmin()?'<div class="card" style="padding:16px;margin-bottom:16px;">'
    +'<p style="font-size:11px;color:var(--accent);font-family:\'DM Mono\',monospace;margin-bottom:10px;">✏️ RÉALISÉ — '+MOISF[MI]+'</p>'
    +'<div class="g2" style="margin-bottom:12px;">'+KPIS.map(function(k){var isNum=(k==="tickets"||k==="iv");return '<div><p style="font-size:10px;color:var(--muted);margin-bottom:3px;font-family:\'DM Mono\',monospace;">'+KPI_LABELS[k]+'</p><input type="number" placeholder="0" value="'+(m[k]||"")+'" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;" onblur="sC(\''+uid+'\','+MI+',\''+k+'\',this.value);showToast(\'Sauvegardé ✅\');"/></div>';}).join("")+'</div>'
    +'<p style="font-size:11px;color:var(--blue);font-family:\'DM Mono\',monospace;margin-bottom:8px;">🎯 OBJECTIFS — '+MOISF[MI]+'</p>'
    +'<div class="g2">'+KPIS.map(function(k){return '<div><p style="font-size:10px;color:var(--blue);margin-bottom:3px;font-family:\'DM Mono\',monospace;">'+KPI_LABELS[k]+'</p><input type="number" placeholder="0" value="'+(m["obj_"+k]||"")+'" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--blue)44;border-radius:6px;color:var(--text);font-size:12px;outline:none;" onblur="saveObj(\''+uid+'\','+MI+',\''+k+'\',this.value);showToast(\'Objectif mis à jour ✅\');"/></div>';}).join("")+'</div></div>':'';

  var annTable='<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:11px;font-family:\'DM Mono\',monospace;"><tr style="color:var(--dim);"><td style="padding:5px;">Mois</td><td style="padding:5px;text-align:right;">Obj CA</td><td style="padding:5px;text-align:right;">CA</td><td style="padding:5px;text-align:right;">%</td></tr>'+MOIS.map(function(ml,i){var mc=gC(uid,i),pp=pct(mc.ca,mc.obj_ca);return '<tr onclick="MI='+i+';rPage();" style="background:'+(i===MI?"var(--accent)22":"transparent")+';cursor:pointer;"><td style="padding:5px;color:'+(i===MI?"var(--accent)":"var(--muted)")+'">'+ml+'</td><td style="padding:5px;text-align:right;color:var(--dim);">'+fmt(mc.obj_ca)+'</td><td style="padding:5px;text-align:right;font-weight:600;">'+(mc.ca?fmt(mc.ca):"—")+'</td><td style="padding:5px;text-align:right;color:'+pcHex(pp)+';font-weight:700;">'+(mc.ca?pp+"%":"—")+'</td></tr>';}).join("")+'</table></div>';

  return backBtn
    +'<p style="color:var(--muted);font-size:11px;font-family:\'DM Mono\',monospace;margin-bottom:4px;">// CHIFFRES 2026'+(MB?" — "+user.name:"")+'</p>'
    +'<h2 style="font-family:\'Syne\',sans-serif;font-size:24px;font-weight:800;margin-bottom:14px;">'+(MB?user.name+' 👤':'Mes Performances')+'</h2>'
    +'<div style="display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;">'+mBtns+'</div>'
    +'<div class="g2" style="margin-bottom:12px;"><div class="kpi-card" style="border-color:var(--gold)33;"><p class="kpi-label">CUMUL TRIM.</p><p class="kpi-val" style="color:var(--gold);">'+fmt(qCA)+'</p><p class="kpi-obj">obj. '+fmt(qOCA)+'</p><div class="pbar"><div class="pfill" style="width:'+Math.min(pct(qCA,qOCA),100)+'%;background:var(--gold);"></div></div><p class="kpi-pct" style="color:'+pcHex(pct(qCA,qOCA))+'">'+pct(qCA,qOCA)+'%</p></div><div class="kpi-card" style="border-color:var(--blue)33;"><p class="kpi-label">CUMUL ANNUEL</p><p class="kpi-val" style="color:var(--blue);">'+fmt(annCA)+'</p><p class="kpi-obj">obj. '+fmt(annOCA)+'</p><div class="pbar"><div class="pfill" style="width:'+Math.min(pct(annCA,annOCA),100)+'%;background:var(--blue);"></div></div><p class="kpi-pct" style="color:'+pcHex(pct(annCA,annOCA))+'">'+pct(annCA,annOCA)+'%</p></div></div>'
    +donutsHtml
    +'<div class="g2" style="margin-bottom:12px;">'+kpis+'</div>'
    +'<div class="card" style="padding:16px;margin-bottom:16px;">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">'
    +'<p style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;">📊 GRAPHIQUE</p>'
    +'<div style="display:flex;gap:4px;">'+chartViewSel+'</div>'
    +'</div>'
    +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;">'+chartKpiSel+'</div>'
    +renderBarChart(chartData,chartObj,chartLabels,KPI_COLORS[CHART_KPI]||"var(--accent)")
    +(chartData.length>1?renderLineChart(chartData,chartLabels,KPI_COLORS[CHART_KPI]||"#C8713A",80):"")
    +'<div style="display:flex;gap:12px;font-size:10px;color:var(--dim);font-family:\'DM Mono\',monospace;margin-top:4px;"><span><span style="display:inline-block;width:8px;height:8px;background:var(--accent)33;border-radius:2px;margin-right:4px;"></span>Objectif</span><span><span style="display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:2px;margin-right:4px;"></span>Réalisé</span></div>'
    +'</div>'
    +editHtml
    +'<div class="card" style="padding:16px;margin-bottom:16px;"><p style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-bottom:10px;">📅 SUIVI PAR DATE</p>'+renderCalendar(uid)+'</div>'
    +'<div class="card" style="padding:16px;"><p style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-bottom:4px;">📋 VUE ANNUELLE</p>'+annTable+'</div>';
}

// ── CHIFFRES ADMIN ──
function pCA(){
  var mi=MI;
  var vendeurs=USERS.filter(function(u){return u.role==="user";});
  var mBtns=MOIS.map(function(ml,i){return '<a href="#" data-action="MI='+i+';rPage();" style="padding:6px 12px;border-radius:8px;font-size:11px;border:1px solid '+(mi===i?"var(--accent)":"var(--border)")+';background:'+(mi===i?"var(--accent)":"var(--bg3)")+';color:'+(mi===i?"#fff":"var(--muted)")+';white-space:nowrap;text-decoration:none;display:inline-block;">'+ml+'</a>';}).join("");
  var T={};KPIS.forEach(function(k){T[k]=0;T["obj_"+k]=0;});
  vendeurs.forEach(function(u){var c=gC(u.id,mi);KPIS.forEach(function(k){T[k]+=c[k]||0;T["obj_"+k]+=c["obj_"+k]||0;});});
  var tot=[{l:"CA",k:"ca",c:"#6B9E5E"},{l:"Canapé",k:"can",c:"#C9993A"},{l:"Outdoor",k:"out",c:"#C8713A"},{l:"BtoB",k:"b2b",c:"#4E7EA8"}].map(function(s){var p=pct(T[s.k],T["obj_"+s.k]);return '<div style="background:var(--bg3);border-radius:10px;padding:12px;"><p style="font-size:10px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-bottom:4px;">'+s.l+'</p><p style="font-family:\'Syne\',sans-serif;font-size:18px;font-weight:800;color:'+s.c+';">'+fmt(T[s.k])+'</p><p style="font-size:10px;color:var(--dim);">obj. '+fmt(T["obj_"+s.k])+' · <span style="color:'+pcHex(p)+';">'+p+'%</span></p></div>';}).join("");
  var mbrs=vendeurs.slice().sort(function(a,b){return (gC(b.id,mi).ca||0)-(gC(a.id,mi).ca||0);}).map(function(mb,idx){
    var m=gC(mb.id,mi),p=pct(m.ca,m.obj_ca);
    return '<div class="card" style="padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;" data-action="MB=\''+mb.id+'\';rPage();">'
      +'<span style="width:22px;height:22px;border-radius:6px;background:'+(idx===0?"var(--gold)":"var(--border)")+';display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:'+(idx===0?"#fff":"var(--dim)")+';flex-shrink:0;">#'+(idx+1)+'</span>'
      +'<div class="av" style="width:32px;height:32px;background:'+mb.col+';font-size:10px;flex-shrink:0;">'+mb.av+'</div>'
      +'<div style="flex:1;"><p style="font-weight:600;font-size:14px;">'+mb.name+'</p><div class="pbar" style="margin-top:4px;"><div class="pfill" style="width:'+Math.min(p,100)+'%;background:'+pcHex(p)+';"></div></div></div>'
      +'<div style="text-align:right;flex-shrink:0;"><p style="font-family:\'Syne\',sans-serif;font-weight:800;font-size:16px;color:'+pcHex(p)+';">'+p+'%</p><p style="font-size:11px;color:var(--dim);">'+fmt(m.ca)+'/'+fmt(m.obj_ca)+'</p></div>'
      +'<span style="color:var(--muted);font-size:12px;">→</span>'
      +'</div>';
  }).join("");
  return '<p style="color:var(--muted);font-size:11px;font-family:\'DM Mono\',monospace;margin-bottom:4px;">// TABLEAU DE BORD ÉQUIPE</p>'
    +'<h2 style="font-family:\'Syne\',sans-serif;font-size:24px;font-weight:800;margin-bottom:14px;">Chiffres Équipe</h2>'
    +'<div style="display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;">'+mBtns+'</div>'
    +'<div style="background:var(--bg2);border:1px solid var(--accent)44;border-radius:var(--radius);padding:16px;margin-bottom:14px;"><p style="font-family:\'Syne\',sans-serif;font-weight:700;font-size:13px;color:var(--accent);margin-bottom:10px;">Totaux — '+MOISF[mi]+'</p><div class="g2">'+tot+'</div></div>'
    +'<p style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-bottom:10px;">CLASSEMENT — cliquer pour le détail</p>'
    +mbrs;
}

// ── DISCUSSION ──
function pD(){
  var u=getCU();
  var managers=USERS.filter(function(x){return (x.role==="admin"||x.role==="adjoint")&&x.id!==CU.id;});
  var others=USERS.filter(function(x){return x.id!==CU.id;});
  var canPrivateWith=isAdmin()?others:managers;

  var tabsHtml='<div class="tabs"><a href="#" class="tab'+(CHAT_TYPE==="public"?" on":"")+'" data-action="CHAT_TYPE=\'public\';CHAT_TARGET=null;rPage();">💬 Public</a><a href="#" class="tab'+(CHAT_TYPE==="private"?" on":"")+'" data-action="CHAT_TYPE=\'private\';rPage();">🔒 Privé</a></div>';

  var content="";
  if(CHAT_TYPE==="public"){
    var msgs=PUB_MSGS;
    var bubbles=msgs.map(function(m){
      var mine=m.au===u.name;
      var delBtn=isAdmin()?'<a href="#" data-action="deletePubMsg(\''+m.id+'\');" style="font-size:10px;color:var(--red);opacity:0.5;text-decoration:none;padding:2px 6px;background:var(--red)11;border-radius:4px;display:block;margin-top:4px;'+(mine?"text-align:right":"text-align:left")+'">🗑️</a>':"";
      return '<div class="bubble '+(mine?"me":"")+'">'
        +(!mine?'<div class="bav" style="background:'+m.col+';">'+m.av+'</div>':"")
        +'<div>'+(!mine?'<p style="font-size:11px;color:'+m.col+';font-weight:600;margin-bottom:3px;">'+m.au+'</p>':"")
        +'<div class="bt" style="background:'+(mine?u.col:"var(--bg2)")+';color:'+(mine?"#fff":"var(--text)")+';">'+m.tx+'</div>'
        +'<p style="font-size:10px;color:var(--dim);margin-top:3px;text-align:'+(mine?"right":"left")+';">'+m.ti+'</p>'
        +delBtn
        +'</div></div>';}).join("");
    content='<div style="margin-bottom:12px;">'+bubbles+'<div id="me"></div></div>'
      +'<div style="display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:10px 0;"><textarea id="mi" rows="2" placeholder="Message à l\'équipe..." style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text);font-size:13px;resize:none;outline:none;"></textarea><a href="#" id="sbtn" style="padding:12px 16px;font-size:18px;border-radius:12px;color:#fff;background:'+u.col+';text-decoration:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;">↑</a></div>';
  } else {
    if(!CHAT_TARGET){
      content='<p style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-bottom:10px;">'+(isAdmin()?"CHOISIR UN INTERLOCUTEUR":"CONTACTER UN MANAGER")+'</p>'
        +canPrivateWith.map(function(v){
          var key=[CU.id,v.id].sort().join("_");
          var msgs=PRIV_MSGS[key]||[];
          var last=msgs.length>0?msgs[msgs.length-1]:null;
          return '<div class="card" style="padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;" data-action="CHAT_TARGET=\''+v.id+'\';rPage();">'
            +'<div class="av" style="width:36px;height:36px;background:'+v.col+';font-size:11px;flex-shrink:0;">'+v.av+'</div>'
            +'<div style="flex:1;"><p style="font-weight:600;font-size:14px;">'+v.name+'</p>'
            +(v.role==="admin"?'<span style="font-size:9px;background:var(--accent)22;color:var(--accent);padding:1px 6px;border-radius:3px;font-family:\'DM Mono\',monospace;">MANAGER</span>':v.role==="adjoint"?'<span style="font-size:9px;background:var(--blue)22;color:var(--blue);padding:1px 6px;border-radius:3px;font-family:\'DM Mono\',monospace;">ADJOINT</span>':"")
            +(last?'<p style="font-size:12px;color:var(--muted);margin-top:2px;">'+last.tx.substring(0,35)+(last.tx.length>35?"...":"")+'</p>':'<p style="font-size:12px;color:var(--dim);margin-top:2px;">Démarrer une conversation</p>')
            +'</div><span style="color:var(--muted);font-size:12px;">→</span></div>';
        }).join("");
    } else {
      var target=USERS.find(function(v){return v.id===CHAT_TARGET;});
      var key=[CU.id,CHAT_TARGET].sort().join("_");
      var msgs=PRIV_MSGS[key]||[];
      var bubbles=msgs.map(function(m){
        var mine=m.au===u.name;
        var delBtn=isAdmin()?'<a href="#" data-action="deletePrivMsg(\''+key+'\',\''+m.id+'\');" style="font-size:10px;color:var(--red);opacity:0.5;text-decoration:none;padding:2px 6px;background:var(--red)11;border-radius:4px;display:block;margin-top:4px;'+(mine?"text-align:right":"text-align:left")+'">🗑️</a>':"";
        return '<div class="bubble '+(mine?"me":"")+'">'
          +(!mine?'<div class="bav" style="background:'+m.col+';">'+m.av+'</div>':"")
          +'<div>'+(!mine?'<p style="font-size:11px;color:'+m.col+';font-weight:600;margin-bottom:3px;">'+m.au+'</p>':"")
          +'<div class="bt" style="background:'+(mine?u.col:"var(--bg2)")+';color:'+(mine?"#fff":"var(--text)")+';">'+m.tx+'</div>'
          +'<p style="font-size:10px;color:var(--dim);margin-top:3px;text-align:'+(mine?"right":"left")+';">'+m.ti+'</p>'
          +delBtn
          +'</div></div>';}).join("");
      content='<a href="#" data-action="CHAT_TARGET=null;rPage();" style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:14px;">← Retour</a>'
        +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;"><div class="av" style="width:36px;height:36px;background:'+(target?target.col:"#888")+';font-size:11px;">'+(target?target.av:"?")+'</div><div><p style="font-family:\'Syne\',sans-serif;font-weight:700;font-size:16px;">'+(target?target.name:"Inconnu")+'</p>'+(target&&target.role!=="user"?'<span style="font-size:9px;background:var(--accent)22;color:var(--accent);padding:1px 6px;border-radius:3px;">MANAGER</span>':"")+'</div></div>'
        +'<div style="margin-bottom:12px;">'+bubbles+'<div id="me"></div></div>'
        +'<div style="display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:10px 0;"><textarea id="mi" rows="2" placeholder="Message privé..." style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text);font-size:13px;resize:none;outline:none;"></textarea><a href="#" id="sbtn" style="padding:12px 16px;font-size:18px;border-radius:12px;color:#fff;background:'+u.col+';text-decoration:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;">↑</a></div>';
    }
  }
  return '<p style="color:var(--muted);font-size:11px;font-family:\'DM Mono\',monospace;margin-bottom:4px;">// DISCUSSION</p><h2 style="font-family:\'Syne\',sans-serif;font-size:24px;font-weight:800;margin-bottom:14px;">Messages</h2>'+tabsHtml+content;
}

function deletePubMsg(id){PUB_MSGS=PUB_MSGS.filter(function(m){return m.id!==id;});lsS("pub_msgs",PUB_MSGS);rPage();}
function deletePrivMsg(key,id){if(!PRIV_MSGS[key])return;PRIV_MSGS[key]=PRIV_MSGS[key].filter(function(m){return m.id!==id;});lsS("priv_msgs",PRIV_MSGS);rPage();}

// ── PLANNING ──
function pPlanning(){
  var addHtml=isAdmin()?'<div class="card" style="padding:16px;margin-bottom:16px;"><p style="font-size:11px;color:var(--accent);font-family:\'DM Mono\',monospace;margin-bottom:10px;">➕ DIFFUSER UN PLANNING</p><div style="display:flex;flex-direction:column;gap:10px;"><input class="inp" id="pl-title" placeholder="Titre *"/><input class="inp" id="pl-date" placeholder="Période (ex: 12-16 Mai 2026)"/><div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;"><p style="font-size:12px;color:var(--muted);">📎 Upload PDF disponible après connexion Supabase</p></div><input class="inp" id="pl-note" placeholder="Note (optionnel)"/><a href="#" data-action="addPlanning();" class="btn btn-accent">Publier →</a></div></div>':"";
  var list=PLANNINGS.length===0?'<p style="color:var(--dim);text-align:center;padding:40px;">Aucun planning publié.</p>':PLANNINGS.map(function(p,i){return '<div class="planning-slot"><div style="width:44px;height:44px;background:var(--accent)22;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">📅</div><div style="flex:1;"><p style="font-weight:600;font-size:14px;">'+p.title+'</p><p style="font-size:12px;color:var(--muted);">'+p.date+'</p>'+(p.note?'<p style="font-size:11px;color:var(--dim);margin-top:2px;">'+p.note+'</p>':"")+'</div>'+(isAdmin()?'<a href="#" data-action="PLANNINGS.splice('+i+',1);lsS(\'plannings\',PLANNINGS);rPage();" style="color:var(--red);font-size:11px;padding:4px 8px;background:var(--red)22;border-radius:6px;text-decoration:none;">✕</a>':"")+'</div>';}).join("");
  return '<p style="color:var(--muted);font-size:11px;font-family:\'DM Mono\',monospace;margin-bottom:4px;">// PLANNING</p><h2 style="font-family:\'Syne\',sans-serif;font-size:24px;font-weight:800;margin-bottom:18px;">Planning Équipe</h2>'+addHtml+list;
}

function addPlanning(){
  var title=document.getElementById("pl-title").value.trim();
  var date=document.getElementById("pl-date").value.trim();
  var note=document.getElementById("pl-note").value.trim();
  if(!title||!date)return;
  PLANNINGS.unshift({id:"p"+Date.now(),title:title,date:date,note:note,au:CU.name,pubDate:new Date().toLocaleDateString("fr-FR")});
  lsS("plannings",PLANNINGS);
  USERS.forEach(function(u){if(u.id!==CU.id)addNotif(u.id,"📅 Nouveau planning : "+title,	"planning");});
  rPage();showToast("Planning publié ✅");
}

// ── ADMIN ──
function pAdmin(){
  var tabs='<div class="tabs"><a href="#" class="tab'+(AT==="actu"?" on":"")+'" data-action="AT=\'actu\';rPage();">📡 Actu</a><a href="#" class="tab'+(AT==="users"?" on":"")+'" data-action="AT=\'users\';rPage();">👥 Équipe</a><a href="#" class="tab'+(AT==="notifs"?" on":"")+'" data-action="AT=\'notifs\';rPage();">🔔 Notifs</a></div>';
  var content="";

  if(AT==="actu"){
    var tO=TAGS.map(function(t){return'<option value="'+t+'">'+t+'</option>';}).join("");
    var list=AC.map(function(a,i){return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;"><div style="flex:1;min-width:0;"><span class="tag" style="background:var(--accent)22;color:var(--accent);">'+a.tag+'</span> <span style="font-weight:600;font-size:13px;">'+a.title+'</span></div><a href="#" data-action="AC.splice('+i+',1);lsS(\'ac\',AC);rPage();" style="background:var(--red)22;border-radius:6px;color:var(--red);font-size:11px;padding:4px 9px;text-decoration:none;flex-shrink:0;">✕</a></div>';}).join("");
    content='<div class="card" style="padding:16px;margin-bottom:16px;"><p style="font-size:11px;color:var(--accent);font-family:\'DM Mono\',monospace;margin-bottom:12px;">➕ PUBLIER</p><div style="display:flex;flex-direction:column;gap:10px;"><input class="inp" id="af-t" placeholder="Titre *"/><textarea class="inp" id="af-c" placeholder="Contenu *" rows="3" style="resize:none;"></textarea><select class="inp" id="af-tag" style="background:var(--bg3);">'+tO+'</select><label style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;"><input type="checkbox" id="af-hot"/> Urgent</label><a href="#" data-action="doAddActu();" class="btn btn-accent">Publier →</a></div></div>'+list;
  }

  if(AT==="users"){
    var ulist=USERS.map(function(u){return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;"><div class="av" style="width:32px;height:32px;background:'+u.col+';font-size:10px;flex-shrink:0;">'+u.av+'</div><div style="flex:1;"><p style="font-weight:600;font-size:14px;">'+u.name+(u.bday?" 🎂":"")+'</p><div style="display:flex;gap:6px;margin-top:2px;align-items:center;"><span style="font-size:9px;background:'+(u.role==="admin"?"var(--accent)22":u.role==="adjoint"?"var(--blue)22":"var(--border)")+';color:'+(u.role==="admin"?"var(--accent)":u.role==="adjoint"?"var(--blue)":"var(--muted)")+';padding:1px 6px;border-radius:3px;font-family:\'DM Mono\',monospace;">'+(u.role==="admin"?"ADMIN":u.role==="adjoint"?"ADJOINT":"USER")+'</span><span style="font-size:11px;color:var(--dim);font-family:\'DM Mono\',monospace;">mdp: '+u.pwd+'</span></div></div><div style="display:flex;gap:6px;flex-shrink:0;"><a href="#" data-action="showEditUser(\''+u.id+'\');" style="background:var(--blue)22;border-radius:6px;color:var(--blue);font-size:11px;padding:4px 9px;text-decoration:none;">✏️</a>'+(u.id!==CU.id?'<a href="#" data-action="deleteUser(\''+u.id+'\');" style="background:var(--red)22;border-radius:6px;color:var(--red);font-size:11px;padding:4px 9px;text-decoration:none;">✕</a>':"")+'</div></div>';}).join("");
    content='<a href="#" data-action="showAddUser();" class="btn btn-accent" style="margin-bottom:14px;">➕ Ajouter un collaborateur</a><br><br>'+ulist;
  }

  if(AT==="notifs"){
    var nlist=NOTIFS.filter(function(n){return n.to==="admin"||n.to===CU.id;}).slice(0,30);
    content=(nlist.length===0?'<p style="color:var(--dim);text-align:center;padding:40px;">Aucune notification.</p>':nlist.map(function(n){return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;"><div style="flex:1;"><p style="font-size:13px;margin-bottom:3px;">'+n.text+'</p><p style="font-size:10px;color:var(--muted);font-family:\'DM Mono\',monospace;">'+n.date+'</p></div>'+(n.type==="pwd_reset"?'<a href="#" data-action="showResetPwd(\''+n.from+'\');" style="background:var(--accent)22;border-radius:6px;color:var(--accent);font-size:11px;padding:4px 9px;text-decoration:none;flex-shrink:0;">Reset</a>':"")+'</div>';}).join(""))
      +'<br><a href="#" data-action="NOTIFS=[];lsS(\'notifs\',NOTIFS);rPage();" class="btn btn-ghost">Effacer tout</a>';
  }

  return '<p style="color:var(--muted);font-size:11px;font-family:\'DM Mono\',monospace;margin-bottom:4px;">// ADMINISTRATION</p><h2 style="font-family:\'Syne\',sans-serif;font-size:24px;font-weight:800;margin-bottom:16px;">Gestion</h2>'+tabs+content;
}

function doAddActu(){
  var t=document.getElementById("af-t"),c=document.getElementById("af-c"),tag=document.getElementById("af-tag"),hot=document.getElementById("af-hot");
  if(!t||!t.value.trim()||!c||!c.value.trim())return;
  var d=new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
  var actu={id:"a"+Date.now(),date:d,tag:tag.value,title:t.value.trim(),txt:c.value.trim(),au:CU.name,hot:hot.checked};
  AC.unshift(actu);lsS("ac",AC);
  // Notification à tous
  USERS.forEach(function(u){if(u.id!==CU.id)addNotif(u.id,"📢 Nouvelle actualité : "+actu.title,"actu");});
  rPage();showToast("Actualité publiée ✅");
}

var _newUserCol=ACCENT_COLS[0];
function showAddUser(){
  var colDots=ACCENT_COLS.map(function(c){return '<div class="col-dot" style="background:'+c+';" data-action="setAccentNew(\''+c+'\');"></div>';}).join("");
  var html='<button class="modal-close" data-action="closeModal();">✕</button><h3>➕ Nouveau collaborateur</h3><div style="display:flex;flex-direction:column;gap:10px;"><input class="inp" id="nu-name" placeholder="Prénom *"/><input class="inp" id="nu-pwd" placeholder="Mot de passe *"/><select class="inp" id="nu-role" style="background:var(--bg3);"><option value="user">Vendeur</option><option value="adjoint">Manager Adjoint</option><option value="admin">Manager</option></select><input class="inp" id="nu-bday" placeholder="Date naissance JJ/MM (optionnel)"/><div style="display:flex;gap:8px;flex-wrap:wrap;" id="new-col-dots">'+colDots+'</div></div><br><a href="#" data-action="saveNewUser();" class="btn btn-accent">Créer</a><br><br><a href="#" data-action="closeModal();" class="btn btn-ghost" style="margin-top:8px;">Annuler</a>';
  showModal(html);
}
function setAccentNew(c){_newUserCol=c;document.querySelectorAll("#new-col-dots .col-dot").forEach(function(d){d.classList.toggle("sel",d.style.background===c||d.style.backgroundColor===c);});}
function saveNewUser(){var name=document.getElementById("nu-name").value.trim();var pwd=document.getElementById("nu-pwd").value.trim();var role=document.getElementById("nu-role").value;var bday=document.getElementById("nu-bday").value.trim();if(!name||!pwd)return;var id=name.toLowerCase().replace(/\s/g,"_")+"_"+Date.now();USERS.push({id:id,name:name,av:name.substring(0,2).toUpperCase(),pwd:pwd,role:role,col:_newUserCol,bday:bday||null,theme:"dark",accentCol:_newUserCol});save();closeModal();rPage();showToast(name+" ajouté ✅");}

function showEditUser(uid){
  var u=USERS.find(function(x){return x.id===uid;});if(!u)return;
  var colDots=ACCENT_COLS.map(function(c){return '<div class="col-dot'+(u.col===c?" sel":"")+'" style="background:'+c+';" data-action="setAccentEdit(\''+uid+'\',\''+c+'\');"></div>';}).join("");
  var html='<button class="modal-close" data-action="closeModal();">✕</button><h3>✏️ Modifier '+u.name+'</h3><div style="display:flex;flex-direction:column;gap:10px;"><input class="inp" id="eu-name" value="'+u.name+'"/><input class="inp" id="eu-pwd" value="'+u.pwd+'" placeholder="Mot de passe"/><select class="inp" id="eu-role" style="background:var(--bg3);"><option value="user"'+(u.role==="user"?" selected":"")+'>Vendeur</option><option value="adjoint"'+(u.role==="adjoint"?" selected":"")+'>Manager Adjoint</option><option value="admin"'+(u.role==="admin"?" selected":"")+'>Manager</option></select><input class="inp" id="eu-bday" value="'+(u.bday||"")+'" placeholder="JJ/MM"/><div style="display:flex;gap:8px;flex-wrap:wrap;" id="edit-col-dots">'+colDots+'</div></div><br><a href="#" data-action="saveEditUser(\''+uid+'\');" class="btn btn-accent">Enregistrer</a><br><br><a href="#" data-action="closeModal();" class="btn btn-ghost" style="margin-top:8px;">Annuler</a>';
  showModal(html);
}
function setAccentEdit(uid,c){USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{col:c,accentCol:c}):u;});document.querySelectorAll("#edit-col-dots .col-dot").forEach(function(d){d.classList.toggle("sel",d.style.background===c||d.style.backgroundColor===c);});}
function saveEditUser(uid){var name=document.getElementById("eu-name").value.trim();var pwd=document.getElementById("eu-pwd").value.trim();var role=document.getElementById("eu-role").value;var bday=document.getElementById("eu-bday").value.trim();USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{name:name,av:name.substring(0,2).toUpperCase(),pwd:pwd||u.pwd,role:role,bday:bday||null}):u;});save();closeModal();rPage();showToast("Profil mis à jour ✅");}
function deleteUser(uid){if(!confirm("Supprimer cet utilisateur ?"))return;USERS=USERS.filter(function(u){return u.id!==uid;});save();rPage();showToast("Utilisateur supprimé");}

function showResetPwd(uid){
  var u=USERS.find(function(x){return x.id===uid;});if(!u)return;
  var html='<button class="modal-close" data-action="closeModal();">✕</button><h3>🔑 Réinitialiser</h3><p style="color:var(--muted);font-size:13px;margin-bottom:16px;">Nouveau mot de passe pour <strong>'+u.name+'</strong></p><input class="inp" id="rp-pwd" placeholder="Nouveau mot de passe *" style="margin-bottom:12px;"/><a href="#" data-action="doResetPwd(\''+uid+'\');" class="btn btn-accent">Confirmer</a><br><br><a href="#" data-action="closeModal();" class="btn btn-ghost" style="margin-top:8px;">Annuler</a>';
  showModal(html,true);
}
function doResetPwd(uid){var pwd=document.getElementById("rp-pwd").value.trim();if(!pwd)return;USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{pwd:pwd}):u;});save();closeModal();showToast("Mot de passe réinitialisé ✅");}
</script>
</body>
</html>

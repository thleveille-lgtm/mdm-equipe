<style>
:root{
  --bg:#0F0D0A;--bg2:#1A1610;--bg3:#221E17;--bg4:#2A2520;
  --border:#3A3028;--border2:#4A3E30;
  --text:#F5ECD8;--muted:#8C7B65;--dim:#5C4E3A;
  --accent:#C8713A;--green:#6B9E5E;--gold:#C9993A;--red:#B85040;--blue:#4E7EA8;--purple:#8B6DB3;
  --radius:14px;--radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
.light{
  --bg:#F5F0E8;--bg2:#EDE8DC;--bg3:#E5DED0;--bg4:#DDD5C5;
  --border:#C8BC9E;--border2:#B0A080;
  --text:#2A1F10;--muted:#6B5C40;--dim:#9A8A6A;
  --shadow:0 4px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;transition:background .3s,color .3s;}
input,button,select,textarea{font-family:'DM Sans',sans-serif;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes confetti{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100px) rotate(720deg);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px var(--accent)40}50%{box-shadow:0 0 25px var(--accent)80}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes popIn{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.anim-up{animation:fadeUp .35s ease both;}
.anim-in{animation:fadeIn .25s ease both;}

/* ── CARDS & INPUTS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s;}
.card:hover{border-color:var(--border2);}
.inp{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;display:block;transition:border-color .2s;}
.inp:focus{border-color:var(--accent);}
.tag{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;display:inline-block;}
.pbar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
.pfill{height:100%;border-radius:3px;transition:width .6s ease;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* ── LOGIN ── */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;overflow:hidden;}
#login::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,var(--accent)15,transparent 70%);pointer-events:none;}
.lbox{width:100%;max-width:380px;position:relative;z-index:1;}
.lbox h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;text-align:center;margin-bottom:4px;}

/* ── APP ── */
#app{display:none;flex-direction:column;min-height:100vh;}
header{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;backdrop-filter:blur(12px);}
.h-logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:8px 12px;overflow-x:auto;}
nav a{color:var(--muted);padding:7px 12px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:all .2s;letter-spacing:.02em;}
nav a.on{background:var(--accent);color:#fff;}
nav a:not(.on):hover{background:var(--bg3);color:var(--text);}
main{padding:18px 14px;flex:1;overflow-y:auto;max-width:600px;width:100%;margin:0 auto;}

/* ── HEADER BUTTONS ── */
.hbtn{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:16px;}
.hbtn:hover{background:var(--bg3);color:var(--text);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;}
.modal-overlay.center{align-items:center;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:fadeUp .3s ease;}
.modal.center{border-radius:20px;animation:popIn .3s ease;}
.modal h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg3);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;}

/* ── BUTTONS ── */
.btn{display:block;padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all .2s;border:none;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{opacity:.9;transform:translateY(-1px);}
.btn-ghost{background:var(--bg3);color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--border2);color:var(--text);}
.btn-danger{background:var(--red)22;color:var(--red);}
.btn-green{background:var(--green);color:#fff;}

/* ── KPI CARD ── */
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.kpi-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:6px 0 2px;}
.kpi-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.04em;}
.kpi-obj{font-size:10px;color:var(--dim);margin-bottom:6px;}
.kpi-pct{font-size:11px;font-weight:700;margin-top:5px;}

/* ── BUBBLE ── */
.bubble{margin-bottom:12px;display:flex;gap:8px;}
.bubble.me{flex-direction:row-reverse;}
.bav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.bt{max-width:78%;border:1px solid var(--border);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:13px;line-height:1.55;background:var(--bg2);}
.bubble.me .bt{border-radius:18px 18px 4px 18px;border:none;}

/* ── AVATAR ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;}

/* ── NOTIF BADGE ── */
.badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-family:'DM Mono',monospace;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}

/* ── BIRTHDAY ── */
.bday-card{background:linear-gradient(135deg,var(--accent)22,var(--gold)11);border:1px solid var(--accent)44;border-radius:var(--radius);padding:16px;margin-bottom:12px;animation:glow 3s infinite;}
.confetti-piece{position:fixed;pointer-events:none;animation:confetti 2s ease-out both;border-radius:2px;}

/* ── CHART ── */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;margin:12px 0;}
.bar{flex:1;border-radius:4px 4px 0 0;transition:height .6s ease;position:relative;cursor:pointer;}
.bar:hover{opacity:.8;}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px;}
.tab{flex:1;padding:7px;border-radius:8px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;text-decoration:none;color:var(--muted);transition:all .2s;}
.tab.on{background:var(--bg2);color:var(--text);box-shadow:var(--shadow);}

/* ── TOGGLE ── */
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}

/* ── COLOR PICKER ── */
.col-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:transform .2s;border:3px solid transparent;}
.col-dot.sel{border-color:#fff;transform:scale(1.2);}
.col-dot:hover{transform:scale(1.1);}

/* ── PROFILE CARD ── */
.profile-ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 12px;position:relative;}
.profile-ring::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent);animation:spin 4s linear infinite;}

/* ── PLANNING ── */
.planning-slot{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s;}
.planning-slot:hover{border-color:var(--accent);transform:translateX(3px);}
</style>
</head>

// ══════════════════════════════════════════════════
function fmt(n){return !n||n===0?"—":n>=1000?(n/1000).toFixed(1)+"K€":Math.round(n)+"€";}
function pct(r,o){return o>0?Math.min(Math.round(r/o*100),999):0;}
function pc(p){return p>=100?"var(--green)":p>=75?"var(--gold)":"var(--red)";}
function pcHex(p){return p>=100?"#6B9E5E":p>=75?"#C9993A":"#B85040";}

function cO(uid,mi){
  var p=PAR[uid];if(!p)return{ca:0,can:0,out:0,b2b:0};
  var custom=OBJ_CUSTOM[uid]||{};
  var base={
    ca:Math.round((OBJ_BASE.ca[mi]||0)*p.ca[mi]/PT.ca),
    can:Math.round((OBJ_BASE.can[mi]||0)*p.can[mi]/PT.can),
    out:Math.round((OBJ_BASE.out[mi]||0)*p.out[mi]/PT.out),
    b2b:Math.round((OBJ_BASE.b2b[mi]||0)*p.b2b[mi]/PT.b2b)
  };
  return {ca:custom[mi+"_ca"]||base.ca,can:custom[mi+"_can"]||base.can,out:custom[mi+"_out"]||base.out,b2b:custom[mi+"_b2b"]||base.b2b};
}

function gC(uid,mi){var k=uid+"_"+mi,s=CH[k]||{},o=cO(uid,mi);return Object.assign({obj_ca:o.ca,ca:0,obj_can:o.can,can:0,obj_out:o.out,out:0,obj_b2b:o.b2b,b2b:0,alma:0,tickets:0,pm:0,iv:0},s);}
function sC(uid,mi,f,v){var k=uid+"_"+mi;if(!CH[k])CH[k]={};CH[k][f]=parseFloat(v)||0;lsS("ch",CH);}

function isAdmin(){return CU&&(CU.role==="admin"||CU.role==="adjoint");}
function getCU(){return USERS.find(function(u){return u.id===CU.id;})||CU;}

function todayBirthdays(){
  var now=new Date();var m=String(now.getMonth()+1).padStart(2,"0");var d=String(now.getDate()).padStart(2,"0");
  return USERS.filter(function(u){return u.bday&&u.bday===d+"/"+m;});
}

function upcomingBirthdays(){
  var now=new Date();var result=[];
  USERS.forEach(function(u){
    if(!u.bday)return;
    var parts=u.bday.split("/");var d=parseInt(parts[0]),m=parseInt(parts[1])-1;
    var bd=new Date(now.getFullYear(),m,d);
    if(bd<now) bd.setFullYear(now.getFullYear()+1);
    var diff=Math.ceil((bd-now)/(1000*60*60*24));
    if(diff<=30&&diff>0) result.push({user:u,days:diff,date:bd});
  });
  return result.sort(function(a,b){return a.days-b.days;});
}

function unreadNotifs(){return NOTIFS.filter(function(n){return !n.read&&(n.to===CU.id||n.to==="admin");}).length;}

function addNotif(to,text,type){NOTIFS.unshift({id:"n"+Date.now(),to:to,from:CU?CU.id:"system",text:text,type:type||"info",read:false,date:new Date().toLocaleDateString("fr-FR")});lsS("notifs",NOTIFS);updateNotifBadge();}

function updateNotifBadge(){
  var count=unreadNotifs();
  var badge=document.getElementById("notif-badge");
  if(badge){badge.style.display=count>0?"block":"none";badge.textContent=count;}
}

function confettiEffect(){
  var colors=["#C8713A","#C9993A","#6B9E5E","#4E7EA8","#9B7DB3"];
  for(var i=0;i<30;i++){
    var el=document.createElement("div");
    el.className="confetti-piece";
    el.style.cssText="left:"+Math.random()*100+"vw;top:-10px;width:"+(4+Math.random()*8)+"px;height:"+(4+Math.random()*8)+"px;background:"+colors[Math.floor(Math.random()*colors.length)]+";animation-delay:"+Math.random()*1+"s;animation-duration:"+(1.5+Math.random())+"s;";
    document.body.appendChild(el);
    setTimeout(function(e){return function(){if(e.parentNode)e.parentNode.removeChild(e);}}(el),3000);
  }
}

function applyTheme(user){
  var u=user||getCU();
  if(u.theme==="light"){document.documentElement.classList.add("light");}
  else{document.documentElement.classList.remove("light");}
  if(u.accentCol){document.documentElement.style.setProperty("--accent",u.accentCol);}
  var btn=document.getElementById("theme-btn");
  if(btn) btn.textContent=u.theme==="light"?"☀️":"🌙";
}

function showModal(html,centered){
  var c=document.getElementById("modal-container");
  c.innerHTML='<div class="modal-overlay'+(centered?" center":"")+'" id="modal-overlay"><div class="modal'+(centered?" center":"")+'" style="position:relative;">'+html+'</div></div>';
  document.getElementById("modal-overlay").onclick=function(e){if(e.target===this) closeModal();};
  bindAll();
}
function closeModal(){document.getElementById("modal-container").innerHTML="";}

function showNotifs(){
  var items=NOTIFS.filter(function(n){return n.to===CU.id||n.to==="admin";});
  items.forEach(function(n){n.read=true;});lsS("notifs",NOTIFS);updateNotifBadge();
  var html='<h3>🔔 Notifications</h3>';
  if(!items.length) html+='<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px;">Aucune notification</p>';
  else html+=items.slice(0,20).map(function(n){return '<div style="padding:12px;background:var(--bg3);border-radius:10px;margin-bottom:8px;"><p style="font-size:13px;margin-bottom:4px;">'+n.text+'</p><p style="font-size:10px;color:var(--muted);font-family:\'DM Mono\',monospace;">'+n.date+'</p></div>';}).join("");
  html+='<br><a href="#" class="btn btn-ghost" data-action="closeModal();">Fermer</a>';

}

var _tempAccent=null;
function setAccent(c){
  _tempAccent=c;
  document.querySelectorAll(".col-dot").forEach(function(d){d.classList.toggle("sel",d.style.background===c||d.style.backgroundColor===c);});
}

function toggleThemeInProfile(){
  var u=getCU();u.theme=u.theme==="light"?"dark":"light";
  USERS=USERS.map(function(x){return x.id===u.id?u:x;});CU=u;save();applyTheme(u);
  showProfile();
}

function saveProfile(){
  var u=getCU();
  var newName=document.getElementById("p-name").value.trim();
  var oldPwd=document.getElementById("p-oldpwd").value.trim();
  var newPwd=document.getElementById("p-newpwd").value.trim();
  var bday=document.getElementById("p-bday").value.trim();
  var err=document.getElementById("p-err");
  if(newPwd&&oldPwd!==u.pwd){err.textContent="Mot de passe actuel incorrect.";err.style.display="block";return;}
  if(!newName){err.textContent="Le prénom ne peut pas être vide.";err.style.display="block";return;}
  u.name=newName;u.av=newName.substring(0,2).toUpperCase();
  if(newPwd) u.pwd=newPwd;
  if(bday) u.bday=bday;
  if(_tempAccent){u.accentCol=_tempAccent;u.col=_tempAccent;document.documentElement.style.setProperty("--accent",_tempAccent);_tempAccent=null;}
  USERS=USERS.map(function(x){return x.id===u.id?u:x;});CU=u;save();
  document.getElementById("hav").style.background=u.col;document.getElementById("hav").textContent=u.av;
  closeModal();
  showToast("Profil mis à jour ✅");
}

function showToast(msg){
  var t=document.createElement("div");
  t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:10px 20px;font-size:13px;z-index:999;animation:popIn .3s ease;";
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2500);
}

function rPage(){
  var m=document.getElementById("main");
  m.style.animation="none";void m.offsetWidth;m.style.animation="fadeUp .3s ease";
  if(PG==="home") m.innerHTML=pH();
  else if(PG==="formations") m.innerHTML=FO?pV():pFL();
  else if(PG==="chiffres") m.innerHTML=isAdmin()&&!MB?pCA():pCU();
  else if(PG==="discussion") m.innerHTML=pD();
  else if(PG==="planning") m.innerHTML=pPlanning();
  else if(PG==="admin") m.innerHTML=pAdmin();
  bindAll();bindMsg();
  if(PG==="discussion") setTimeout(function(){var e=document.getElementById("me");if(e)e.scrollIntoView({behavior:"smooth"});},100);
}

function bindAll(){
  document.querySelectorAll("[data-action]").forEach(function(el){
    el.onclick=function(e){e.preventDefault();try{eval(this.getAttribute("data-action"));}catch(err){console.error(err);}};
  });
}

function bindMsg(){
  var sb=document.getElementById("sbtn");
  if(sb) sb.onclick=function(e){
    e.preventDefault();
    var inp=document.getElementById("mi");if(!inp||!inp.value.trim())return;
    var t=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    var msg={id:"m"+Date.now(),au:CU.name,av:CU.av,col:CU.col,tx:inp.value.trim(),ti:t};
    if(CHAT_TYPE==="public"){PUB_MSGS.push(msg);lsS("pub_msgs",PUB_MSGS);}
    else{var key=CHAT_TARGET;if(!PRIV_MSGS[key])PRIV_MSGS[key]=[];PRIV_MSGS[key].push(msg);lsS("priv_msgs",PRIV_MSGS);}
    inp.value="";rPage();
  };
  var inp=document.getElementById("mi");
  if(inp) inp.addEventListener("keydown",function(e){if(e.keyCode===13&&!e.shiftKey){e.preventDefault();var sb=document.getElementById("sbtn");if(sb)sb.onclick(e);}});
}

function doLogout(){
  CU=null;PG="home";FO=null;MB=null;CHAT_TARGET=null;
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("lu").value="";document.getElementById("lp").value="";
  document.getElementById("lerr").style.display="none";
  document.getElementById("hadmin").style.display="none";
  document.documentElement.classList.remove("light");
  document.documentElement.style.removeProperty("--accent");
  closeModal();
}

// Override sendMsg pour chat privé
function bindMsg(){
  var sb=document.getElementById("sbtn");
  if(!sb) return;
  sb.onclick=function(e){
    e.preventDefault();
    var inp=document.getElementById("mi");if(!inp||!inp.value.trim())return;
    var t=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    var msg={id:"m"+Date.now(),au:CU.name,av:CU.av,col:CU.col,tx:inp.value.trim(),ti:t};
    if(CHAT_TYPE==="public"){PUB_MSGS.push(msg);lsS("pub_msgs",PUB_MSGS);}
    else if(CHAT_TARGET){
      var key=[CU.id,CHAT_TARGET].sort().join("_");
      if(!PRIV_MSGS[key])PRIV_MSGS[key]=[];
      PRIV_MSGS[key].push(msg);lsS("priv_msgs",PRIV_MSGS);
      if(CU.id!==CHAT_TARGET) addNotif(CHAT_TARGET,"💬 "+CU.name+" vous a envoyé un message privé.","msg");
    }
    inp.value="";rPage();
    setTimeout(function(){var e=document.getElementById("me");if(e)e.scrollIntoView({behavior:"smooth"});},100);
  };
  var inp=document.getElementById("mi");
  if(inp) inp.addEventListener("keydown",function(e){if(e.keyCode===13&&!e.shiftKey){e.preventDefault();if(sb)sb.onclick(e);}});
}

    +'<div style="display:flex;gap:8px;flex-wrap:wrap;" id="edit-col-dots">'+colDots+'</div>'
    +'</div><br>'
    +'<a href="#" data-action="saveEditUser(\''+uid+'\');" class="btn btn-accent">Enregistrer</a>'
    +'<br><br><a href="#" data-action="closeModal();" class="btn btn-ghost" style="margin-top:8px;">Annuler</a>';
  showModal(html);
}

function setAccentEdit(uid,c){USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{col:c,accentCol:c}):u;});document.querySelectorAll("#edit-col-dots .col-dot").forEach(function(d){d.classList.toggle("sel",d.style.background===c||d.style.backgroundColor===c);});}

function saveEditUser(uid){
  var name=document.getElementById("eu-name").value.trim();
  var pwd=document.getElementById("eu-pwd").value.trim();
  var role=document.getElementById("eu-role").value;
  var bday=document.getElementById("eu-bday").value.trim();
  USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{name:name,av:name.substring(0,2).toUpperCase(),pwd:pwd||u.pwd,role:role,bday:bday||null}):u;});
  save();closeModal();rPage();showToast("Profil mis à jour ✅");
}

function deleteUser(uid){
  if(!confirm("Supprimer cet utilisateur ?"))return;
  USERS=USERS.filter(function(u){return u.id!==uid;});
  save();rPage();showToast("Utilisateur supprimé");
}

function showResetPwd(uid,ni){
  var u=USERS.find(function(x){return x.id===uid;});if(!u)return;
  var html='<h3>🔑 Réinitialiser le mot de passe</h3>'
    +'<p style="color:var(--muted);font-size:13px;margin-bottom:16px;">Nouveau mot de passe pour <strong>'+u.name+'</strong></p>'
    +'<input class="inp" id="rp-pwd" placeholder="Nouveau mot de passe *" style="margin-bottom:12px;"/>'
    +'<a href="#" data-action="doResetPwd(\''+uid+'\','+ni+');" class="btn btn-accent">Confirmer</a>'
    +'<br><br><a href="#" data-action="closeModal();" class="btn btn-ghost" style="margin-top:8px;">Annuler</a>';
  showModal(html,true);
}

function doResetPwd(uid,ni){
  var pwd=document.getElementById("rp-pwd").value.trim();if(!pwd)return;
  USERS=USERS.map(function(u){return u.id===uid?Object.assign({},u,{pwd:pwd}):u;});
  if(NOTIFS[ni])NOTIFS[ni].read=true;
  save();closeModal();showToast("Mot de passe réinitialisé ✅");
}
</script>
</body>
</html>
